<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Учёт «Разденься»</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Учёт">
<meta name="theme-color" content="#FAF8F3">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Marck+Script&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Раскладка: липкая шапка (вкладки Деньги/Материалы + значки: скрыть суммы, заметка, настройки); действия — нижним листом с прилипшей кнопкой; настройки — отдельный экран за значком */
  :root{
    --bg:#FAF8F3;
    --surface:#FFFFFF;
    --sunk:#EFEBE1;
    --ink:#16130E;
    --ink-2:#5C5343;
    --ink-3:#8F8571;
    --line:rgba(22,19,14,.11);
    --gold:#8C6D2A;
    --gold-btn:#C6A24B;
    --gold-ink:#16130E;
    --gold-soft:rgba(198,162,75,.17);
    --cash-bg:#16130E;
    --cash-ink:#F2ECDD;
    --cash-dim:#B9AC93;
    --cash-gold:#E3C177;
    --cash-line:rgba(227,193,119,.22);
    --cash-pos:#9FD9B3;
    --cash-neg:#F4A79E;
    --ok:#2D7549;
    --ok-soft:rgba(45,117,73,.12);
    --warn:#B25C14;
    --warn-soft:rgba(178,92,20,.13);
    --bad:#B0281F;
    --bad-soft:rgba(176,40,31,.11);
    --scrim:rgba(22,19,14,.42);
    --shadow:0 12px 36px rgba(22,19,14,.16);
    --shadow-sm:0 1px 3px rgba(22,19,14,.10);
    --foot-shade:rgba(22,19,14,.10);
    --f-display:'Bodoni Moda',Georgia,'Times New Roman',serif;
    --f-ui:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }

  *{box-sizing:border-box;}
  [hidden]{display:none!important;}
  html{-webkit-text-size-adjust:100%;touch-action:manipulation;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:500 16px/1.45 var(--f-ui);
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:0 48px;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
    overflow-x:hidden;
  }
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  button:disabled{cursor:default;}
  input,textarea,select{font:inherit;color:var(--ink);}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  a{color:var(--gold);}
  .wrap{max-width:1040px;margin:0 auto;}
  .num{font-variant-numeric:tabular-nums lining-nums;}
  .hide-sums .sum{filter:blur(9px);-webkit-user-select:none;user-select:none;}

  /* ---------- шапка ---------- */
  .top{
    position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
    background:var(--bg);box-shadow:0 0 0 100vmax var(--bg);clip-path:inset(0 -100vmax);
    padding-block:12px 12px;
  }
  .brand{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .brand h1{margin:0;font:600 27px/1 var(--f-display);letter-spacing:.005em;white-space:nowrap;}
  .brand h1 span{font:800 11px/1 var(--f-ui);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-left:10px;position:relative;top:-4px;}
  .tools{display:flex;align-items:center;gap:2px;}
  .sync{font-size:12px;font-weight:600;color:var(--ink-3);display:flex;align-items:center;gap:6px;white-space:nowrap;margin-right:6px;min-height:44px;cursor:pointer;}
  .sync.off{color:var(--bad);}
  .sync i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);display:inline-block;}
  .sync.on i{background:var(--ok);}
  .sync.busy i{background:var(--gold-btn);}
  .sync.off i{background:var(--bad);}
  @media (max-width:520px){.sync span{display:none;}}
  .ib{width:44px;height:44px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);position:relative;}
  .ib svg{width:22px;height:22px;}
  .ib[aria-pressed="true"]{background:var(--gold-soft);color:var(--gold);}
  .ib .dotb{position:absolute;top:3px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--warn);color:var(--surface);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--sunk);border-radius:14px;padding:4px;margin-top:12px;}
  .tab{min-height:44px;border-radius:10px;font-weight:700;font-size:15px;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:7px;}
  .tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);}
  .tab .ts{display:none;}
  @media (max-width:560px){.tab{font-size:13.5px;gap:4px;}.tab .badge{min-width:17px;height:17px;font-size:11px;padding:0 4px;}}
  @media (max-width:420px){.tab .tl{display:none;}.tab .ts{display:inline;}}
  .badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--warn);color:var(--surface);font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;}
  .badge.g{background:var(--gold-btn);color:var(--gold-ink);}
  .set-head{display:flex;align-items:center;gap:10px;margin-top:12px;min-height:44px;}
  .set-head b{font:600 22px/1.1 var(--f-display);}
  .back{min-height:44px;padding:0 14px;border-radius:12px;background:var(--sunk);font-weight:700;font-size:15px;}

  .banner{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--bad-soft);color:var(--ink);font-size:14px;}
  .banner b{color:var(--bad);}
  .banner a{color:var(--gold);font-weight:700;overflow-wrap:anywhere;}

  main{padding-top:8px;}
  /* экран вкладки и календарь въезжают сбоку — на iPhone страница не должна от этого уезжать вбок */
  main{overflow-x:clip;}
  @supports not (overflow:clip){ main{overflow-x:hidden;} }
  .view{display:grid;gap:22px;}

  /* ---------- общие ---------- */
  h2.h{margin:0 0 8px;padding-left:4px;font:800 12px/1.2 var(--f-ui);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  h2.h em{font-style:normal;letter-spacing:0;text-transform:none;font-weight:600;font-size:13px;color:var(--ink-3);}
  .group{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;}
  .group > * + *{border-top:1px solid var(--line);}
  .stack{display:grid;gap:10px;}
  .empty{padding:18px 16px;color:var(--ink-2);font-size:15px;}
  .hint{margin:0;color:var(--ink-2);font-size:14px;}
  .hint b{color:var(--ink);}
  .note{margin:10px 4px 0;color:var(--ink-3);font-size:14px;max-width:62ch;}
  .btn{min-height:52px;border-radius:16px;padding:0 18px;font-weight:700;font-size:16px;line-height:1.15;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface);border:1px solid var(--line);color:var(--ink);text-decoration:none;text-align:center;}
  .btn.primary{background:var(--gold-btn);color:var(--gold-ink);border-color:transparent;}
  .btn.block{width:100%;}
  .btn:disabled{opacity:.42;}
  .btn.danger{color:var(--bad);}
  .btn.armed{background:var(--bad);color:var(--surface);border-color:transparent;}
  .btn .sign{font-size:22px;line-height:0;font-weight:600;}
  .add{justify-self:start;}
  .ro .w{display:none!important;}

  /* ---------- деньги ---------- */
  .money{display:grid;gap:22px;}
  .col{display:grid;gap:22px;align-content:start;min-width:0;}
  @media (min-width:900px){.money{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start;}}
  @media (max-width:599px){.q-block{order:-1;}}
  .cash{background:var(--cash-bg);color:var(--cash-ink);border-radius:22px;padding:18px 20px 16px;display:grid;gap:10px;}
  .cash-head{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .eyebrow{font:800 11px/1.2 var(--f-ui);letter-spacing:.15em;text-transform:uppercase;color:var(--cash-dim);}
  .cash-start{font-size:13px;font-weight:600;color:var(--cash-gold);min-height:44px;padding:0 0 0 12px;}
  .cash-sum{font:600 clamp(38px,9vw,58px)/1.02 var(--f-display);font-variant-numeric:lining-nums;letter-spacing:-.01em;overflow-wrap:anywhere;}
  .cash-sum.neg{color:var(--cash-gold);}
  .cash-split,.cash-all{font-size:13px;color:var(--cash-dim);}
  .cash-split b{color:var(--cash-ink);font-weight:700;}
  .cash-nudge{font-size:14px;color:var(--cash-gold);text-align:left;font-weight:600;min-height:44px;justify-self:start;}
  .month{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--cash-line);padding-top:12px;margin-top:2px;}
  .month b{font-weight:700;font-size:15px;}
  .mbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--cash-line);color:var(--cash-ink);font-size:20px;line-height:1;display:inline-flex;align-items:center;justify-content:center;}
  .mbtn:disabled{opacity:.3;}
  .kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
  .kpi span{display:block;font-size:12px;font-weight:600;color:var(--cash-dim);}
  .kpi b{display:block;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .kpi b.pos{color:var(--cash-pos);}
  .kpi b.neg{color:var(--cash-neg);}
  .cash-foot{font-size:13px;color:var(--cash-dim);}

  .tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
  @media (min-width:560px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr));}}
  @media (min-width:900px){.money .tiles{grid-template-columns:repeat(2,minmax(0,1fr));}}
  @media (min-width:1000px){.money .tiles{grid-template-columns:repeat(3,minmax(0,1fr));}}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:11px 13px;min-height:68px;display:flex;flex-direction:column;justify-content:space-between;gap:4px;text-align:left;}
  .tile span{font-weight:700;font-size:15px;line-height:1.25;}
  .tile b{font-weight:700;font-size:14px;color:var(--gold);font-variant-numeric:tabular-nums;}
  .tile b.nop{color:var(--ink-3);font-weight:600;}
  .tile:active{background:var(--gold-soft);}
  .tile[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold-btn);box-shadow:inset 0 0 0 1px var(--gold-btn);}
  .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px;}
  .cash-btns{display:flex;gap:4px;}
  .cash-chk{font-size:14px;color:var(--cash-gold);text-align:left;font-weight:700;min-height:44px;justify-self:start;}
  .note-card{background:var(--warn-soft);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:grid;gap:8px;}
  .note-card h2{margin:0;font:800 12px/1.2 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--warn);}
  .note-card p{margin:0;font-size:15px;}
  .note-card.late{background:var(--bad-soft);}
  .note-card.late h2{color:var(--bad);}
  .note-card .cf-btns{flex-wrap:wrap;}
  .report{background:var(--surface);border:1px solid var(--line);border-radius:18px;}
  .report > summary{list-style:none;cursor:pointer;min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;font-weight:800;font-size:15px;}
  .report > summary::-webkit-details-marker{display:none;}
  .report > summary em{font-style:normal;font-weight:600;font-size:13px;color:var(--ink-3);}
  .report > summary::after{content:'▾';color:var(--ink-3);transition:transform .2s;}
  .report[open] > summary::after{transform:rotate(180deg);}
  .report .rep-body{display:grid;gap:18px;padding:0 0 14px;}
  .report .rep-body > div > .h{padding:0 16px;}
  .report .group{border:0;box-shadow:none;background:transparent;}
  .limit{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;margin:0 16px;}
  .limit i{display:block;height:100%;border-radius:4px;background:var(--gold-btn);}
  .limit.warn i{background:var(--warn);}
  .j-search{display:block;width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--field);padding:0 12px;font:600 16px/1 var(--f-ui);color:var(--ink);margin-bottom:8px;}
  .entry .a.mv{color:var(--ink-2);}
  .chkdot{display:inline-block;margin-left:6px;font-size:11px;font-weight:800;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:1px 5px;vertical-align:1px;}
  .chk-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);}
  .chk-row:first-child{border-top:0;}
  .chk-row b{display:block;font-size:15px;}
  .chk-row small{display:block;font-size:13px;color:var(--ink-3);}

  .bars{padding:14px 16px;display:grid;gap:12px;}
  .bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;font-size:15px;}
  .bar b{font-weight:700;font-variant-numeric:tabular-nums;}
  .bar b.minus{color:var(--bad);}
  .bar .track{grid-column:1/-1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;}
  .bar .track i{display:block;height:100%;border-radius:3px;background:var(--gold-btn);}
  .kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;padding:14px 16px;font-size:15px;}
  .kv b{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;}
  .kv b.minus{color:var(--bad);}
  .counts{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px;}
  .count{background:var(--sunk);border-radius:12px;padding:7px 11px;font-size:14px;font-weight:600;}
  .count b{color:var(--gold);margin-left:4px;}

  .day{padding:10px 16px 6px;font-size:13px;font-weight:700;color:var(--ink-3);background:var(--sunk);}
  .entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:11px 16px;width:100%;text-align:left;}
  .entry:active{background:var(--sunk);}
  .entry .t{display:block;font-weight:700;font-size:15px;line-height:1.3;overflow-wrap:anywhere;}
  .entry .s{display:block;font-size:13px;color:var(--ink-3);overflow-wrap:anywhere;}
  .entry .a{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .entry .a.in{color:var(--ok);}
  .entry .a.ref{color:var(--bad);}

  /* ---------- материалы ---------- */
  .stock-groups{display:grid;gap:22px;}
  @media (min-width:900px){.stock-groups{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;}}
  .need{background:var(--warn-soft);border-radius:18px;padding:14px 16px;display:grid;gap:10px;}
  .need.fine{background:var(--ok-soft);}
  .need h2{margin:0;font:800 12px/1.2 var(--f-ui);letter-spacing:.13em;text-transform:uppercase;color:var(--warn);}
  .need.fine h2{color:var(--ok);}
  .need-list{display:flex;flex-wrap:wrap;gap:8px;}
  .need-chip{background:var(--surface);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700;text-align:left;min-height:44px;}
  .need-chip small{font-weight:600;color:var(--ink-3);margin-left:6px;font-size:13px;}
  .need-chip.out small{color:var(--bad);}
  .it{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:6px 8px 6px 0;}
  .row-main{display:grid;gap:2px;text-align:left;padding:8px 4px 8px 16px;min-height:52px;align-content:center;min-width:0;width:100%;}
  .row-title{font-weight:700;font-size:15px;line-height:1.3;display:flex;flex-wrap:wrap;align-items:center;gap:6px;overflow-wrap:anywhere;}
  .row-sub{font-size:13px;color:var(--ink-3);overflow-wrap:anywhere;}
  .pill{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:7px;}
  .pill.low{background:var(--warn-soft);color:var(--warn);}
  .pill.out{background:var(--bad-soft);color:var(--bad);}
  .pill.unk{background:var(--sunk);color:var(--ink-3);}
  .pill.sale{background:var(--gold-soft);color:var(--gold);}
  .step{display:flex;align-items:center;gap:4px;}
  .step-b{width:44px;height:44px;border-radius:13px;background:var(--sunk);font-size:22px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);flex:none;}
  .step-b.plus{background:var(--gold-soft);color:var(--gold);}
  .step-b:disabled{opacity:.35;}
  .step-q{min-width:58px;text-align:center;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;line-height:1.1;}
  .step-q small{display:block;font-size:11px;font-weight:600;color:var(--ink-3);}
  .it.st-low .step-q{color:var(--warn);}
  .it.st-out .step-q{color:var(--bad);}
  .ro .it .step-b{display:none;}

  /* ---------- настройки ---------- */
  .svc-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding-right:16px;}
  .svc-price{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .svc-price.nop{color:var(--ink-3);font-weight:600;font-size:14px;}
  .fb{padding:12px 16px;display:grid;gap:8px;}
  .fb p{margin:0;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere;}
  .fb-meta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-3);}
  .fb.done p{color:var(--ink-3);text-decoration:line-through;}
  .help{padding:4px 0;}
  .help details{padding:0 16px;}
  .help details + details{border-top:1px solid var(--line);}
  .help summary{cursor:pointer;padding:13px 0;font-weight:700;font-size:15px;list-style:none;display:flex;justify-content:space-between;gap:10px;}
  .help summary::-webkit-details-marker{display:none;}
  .help summary::after{content:'+';color:var(--ink-3);font-weight:600;}
  .help details[open] summary::after{content:'−';}
  .help details p{margin:0 0 14px;color:var(--ink-2);font-size:15px;}

  /* ---------- лист ---------- */
  .scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;}
  .sheet{
    background:var(--bg);width:100%;max-width:620px;max-height:92%;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    border-radius:24px 24px 0 0;box-shadow:var(--shadow);
    padding-top:6px;padding-bottom:0;
    padding-left:max(18px,env(safe-area-inset-left,0px));
    padding-right:max(18px,env(safe-area-inset-right,0px));
    animation:up .22s ease-out;
  }
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
  @media (prefers-reduced-motion:reduce){.sheet{animation:none;}}
  @media (min-width:700px){
    .scrim{align-items:center;padding:20px;}
    .sheet{border-radius:24px;padding-left:24px;padding-right:24px;max-height:94%;}
  }
  .sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0 8px;position:sticky;top:-6px;background:var(--bg);z-index:2;}
  .sheet-head h3{margin:0;font:600 24px/1.15 var(--f-display);}
  .close{width:44px;height:44px;border-radius:50%;background:var(--sunk);font-size:22px;line-height:1;display:inline-flex;align-items:center;justify-content:center;flex:none;}
  .sheet-body{display:grid;gap:16px;padding:6px 0 18px;}
  .sheet-foot{position:sticky;bottom:0;z-index:2;background:var(--bg);display:grid;gap:10px;padding:12px 0 calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -12px 14px -14px var(--foot-shade);}
  .sec-l{font:800 12px/1.2 var(--f-ui);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin-bottom:-6px;}
  .fld{display:grid;gap:6px;min-width:0;}
  .fld > span{font-size:13px;font-weight:700;color:var(--ink-2);}
  .fld input,.fld textarea,.fld select{width:100%;min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:17px;font-weight:600;}
  .fld textarea{padding:12px 14px;min-height:110px;resize:vertical;line-height:1.4;}
  .fld input:focus,.fld textarea:focus,.fld select:focus{outline:2px solid var(--gold-btn);outline-offset:0;border-color:transparent;}
  .fld input[type="date"]{min-width:0;-webkit-appearance:none;appearance:none;}
  .money-in{position:relative;}
  .money-in input{font-size:26px;font-weight:800;padding-right:44px;min-height:60px;font-variant-numeric:tabular-nums;}
  .money-in i{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-style:normal;font-size:22px;font-weight:700;color:var(--ink-3);pointer-events:none;}
  .fld-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px;}
  .fld-row.even{grid-template-columns:repeat(2,minmax(0,1fr));}
  @media (max-width:420px){.fld-row:not(.even){grid-template-columns:1fr;}}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{min-height:44px;padding:0 15px;border-radius:13px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:15px;}
  .chip[aria-checked="true"],.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);}
  .chip.sm{min-height:44px;min-width:44px;padding:0 12px;font-size:14px;}
  .uses{display:grid;}
  .use{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:6px 0 6px 2px;border-top:1px solid var(--line);}
  .use:first-child{border-top:0;}
  .use .nm{font-weight:600;font-size:15px;overflow-wrap:anywhere;}
  .use .nm small{color:var(--ink-3);font-weight:600;margin-left:4px;}
  .use.on .nm{font-weight:800;}
  .use-x{width:44px;height:44px;border-radius:12px;color:var(--ink-3);font-size:22px;line-height:1;display:inline-flex;align-items:center;justify-content:center;flex:none;}
  .use-x:active{background:var(--bad-soft);color:var(--bad);}
  .use-add{display:block;width:100%;min-height:48px;margin-top:8px;border-radius:12px;border:1px dashed var(--gold-btn);background:var(--field);color:var(--gold);font:700 16px/1 var(--f-ui);padding:0 12px;}
  .uses .use-in{width:64px;min-height:0;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:center;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;padding:0 4px;}
  .uses .use-in:focus{outline:2px solid var(--gold-btn);outline-offset:0;border-color:transparent;}
  .uses .use-in:disabled{opacity:.6;}
  .buy-g{margin:12px 0 2px;font:800 11px/1.2 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);}
  .buy-g:first-child{margin-top:0;}
  .buy-g.warn{color:var(--warn);}
  .buy .use{border-radius:12px;padding:3px 4px 3px 10px;}
  .buy-g + .use{border-top:0;}
  .buy .use.on{background:var(--gold-soft);border-top-color:transparent;}
  .buy .use.on + .use{border-top-color:transparent;}
  .buy-nm{display:block;width:100%;min-height:44px;padding:3px 0;text-align:left;font:inherit;color:inherit;background:none;border:0;}
  .buy-nm b{display:block;font-weight:600;font-size:15px;overflow-wrap:anywhere;}
  .buy .use.on .buy-nm b{font-weight:800;}
  .buy-nm small{display:block;margin-top:2px;font-size:13px;font-weight:600;color:var(--ink-3);}
  .buy-nm small.low{color:var(--warn);}
  .buy-nm small em{font-style:normal;color:var(--gold);font-weight:800;}
  .step-b.solo{background:var(--gold-btn);color:var(--gold-ink);}
  .foot-hint{font-size:13px;line-height:1.35;}
  .rc-u{min-width:34px;font-size:13px;font-weight:700;color:var(--ink-3);}
  .rc-in{width:84px!important;}
  /* iPad: окно закупки шире, материалы в две колонки */
  @media (min-width:700px){
    .sheet.wide{max-width:780px;}
    .sheet.wide .buy{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:14px;row-gap:2px;}
    .sheet.wide .buy-g{grid-column:1/-1;}
    .sheet.wide .buy .use{border-top:0;}
  }
  .mat{background:var(--surface);border:1px solid var(--line);border-radius:16px;}
  .mat-sum{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;font-size:14px;color:var(--ink-2);}
  .mat-sum b{color:var(--ink);font-weight:700;}
  .mat-sum em{font-style:normal;color:var(--gold);font-weight:700;white-space:nowrap;}
  .mat-ed{padding:0 14px 8px;border-top:1px solid var(--line);}
  .good{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);}
  .good:first-child{border-top:0;}
  .good .nm{font-weight:700;font-size:15px;overflow-wrap:anywhere;}
  .good .nm small{display:block;font-weight:600;font-size:13px;color:var(--ink-3);}
  .good.on .nm{color:var(--gold);}
  .big-step{display:flex;align-items:center;gap:10px;}
  .big-step input{text-align:center;font-size:26px;font-weight:800;min-height:60px;}
  .big-step .step-b{width:60px;height:60px;flex:none;font-size:26px;}
  .cat-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;}
  .cat-row input{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:16px;font-weight:600;}
  .cat-row input:focus{outline:2px solid var(--gold-btn);outline-offset:0;border-color:transparent;}
  .cat-row input:disabled{opacity:.7;}
  .cat-row .lockd{font-size:12px;color:var(--ink-3);padding:0 8px;}
  .ok-big{margin:0;font-size:17px;font-weight:600;}

  /* ---------- запись клиенток ---------- */
  .book{display:grid;gap:22px;}
  @media (min-width:900px){.book{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start;}}
  .cal{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;}
  .cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;padding-left:4px;}
  .cal-head b{font:600 21px/1.2 var(--f-display);}
  .cal-nav{display:flex;gap:6px;align-items:center;}
  .cbtn{width:44px;height:44px;border-radius:12px;background:var(--sunk);font-size:20px;line-height:1;display:inline-flex;align-items:center;justify-content:center;}
  .ctoday{min-height:44px;padding:0 12px;border-radius:12px;background:var(--sunk);font-weight:700;font-size:14px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;}
  .cal-wd{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:center;padding:4px 0;}
  .cal-wd.we{color:var(--gold);}
  .cd{min-height:50px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding:6px 2px;font-variant-numeric:tabular-nums;min-width:0;}
  .cd .n{font-weight:700;font-size:15px;line-height:1.2;}
  .cd .c{min-width:20px;height:18px;padding:0 5px;border-radius:9px;background:var(--gold-soft);color:var(--gold);font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;}
  .cd .tt{display:none;font-size:11px;font-weight:600;color:var(--ink-3);line-height:1.25;text-align:center;}
  @media (min-width:700px){.cd{min-height:66px;}.cd .tt{display:block;}.cd .c{display:none;}}
  .cd.other{opacity:.35;}
  .cd.past .n{color:var(--ink-3);}
  .cd.today{box-shadow:inset 0 0 0 1.5px var(--gold-btn);}
  .cd[aria-pressed="true"]{background:var(--ink);color:var(--bg);}
  .cd[aria-pressed="true"] .n{color:var(--bg);}
  .cd[aria-pressed="true"] .c{background:var(--gold-btn);color:var(--gold-ink);}
  .cd[aria-pressed="true"] .tt{color:var(--bg);opacity:.8;}
  .day-h{margin:0 0 10px 4px;font:600 22px/1.2 var(--f-display);}
  .bk{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;width:100%;text-align:left;}
  .bk:active{background:var(--sunk);}
  .bk-time{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;line-height:1.15;}
  .bk-time small{display:block;font-size:12px;font-weight:600;color:var(--ink-3);}
  .bk-main{min-width:0;}
  .bk-main b{display:block;font-size:16px;font-weight:700;overflow-wrap:anywhere;}
  .bk-main small{display:block;font-size:13px;color:var(--ink-3);overflow-wrap:anywhere;}
  .bk-st{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:7px;white-space:nowrap;}
  .bk.st-done .bk-st{background:var(--ok-soft);color:var(--ok);}
  .bk.st-noshow .bk-st,.bk.st-cancel .bk-st{background:var(--bad-soft);color:var(--bad);}
  .bk.st-cancel .bk-main b,.bk.st-noshow .bk-main b{color:var(--ink-3);}
  .bk.st-cancel .bk-main b{text-decoration:line-through;}
  .confirm{background:var(--warn-soft);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:grid;gap:8px;}
  .confirm h2{margin:0 0 2px;font:800 12px/1.2 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--warn);}
  .cf-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;align-items:center;background:var(--surface);border-radius:14px;padding:8px 8px 8px 12px;}
  .cf-row b{display:block;font-weight:700;font-size:15px;overflow-wrap:anywhere;}
  .cf-row small{display:block;font-size:13px;color:var(--ink-3);overflow-wrap:anywhere;}
  .cf-btns{display:flex;gap:6px;}
  .cf-btns .btn{min-height:44px;padding:0 12px;font-size:14px;border-radius:12px;}
  .bk-st.wait{background:var(--warn-soft);color:var(--warn);}
  @media (max-width:520px){.cf-row{grid-template-columns:1fr;}.cf-btns .btn{flex:1;}}
  .recall{background:var(--gold-soft);}
  .recall h2{color:var(--gold);}
  .rem{display:flex;flex-wrap:wrap;gap:6px;}
  .rem .chip{display:inline-flex;align-items:center;text-decoration:none;color:inherit;}
  .cl-search{display:block;width:100%;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--field);padding:0 14px;font:600 16px/1 var(--f-ui);color:var(--ink);}
  .hist{display:grid;gap:0;}
  .hist .entry{padding:9px 4px;}
  .course{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--gold);background:var(--gold-soft);border-radius:8px;padding:2px 7px;}
  .gap{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:48px;padding:11px 14px;text-align:left;color:var(--ink-3);font-size:14px;font-weight:600;background:var(--bg);}
  .gap em{font-style:normal;color:var(--gold);font-weight:700;white-space:nowrap;}
  .gap:active{background:var(--gold-soft);}

  /* ---------- блокировка ---------- */
  .lock{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;align-items:center;justify-content:center;
    padding:24px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));}
  .lock-box{width:100%;max-width:320px;display:grid;gap:16px;justify-items:center;text-align:center;}
  .lock-brand{font:600 34px/1 var(--f-display);}
  .lock-t{margin:0;color:var(--ink-2);font-weight:600;}
  .dots{display:flex;gap:16px;}
  .dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink-3);}
  .dots i.on{background:var(--ink);border-color:var(--ink);}
  .dots.shake{animation:shake .32s;}
  @keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
  .lock-err{min-height:20px;color:var(--bad);font-size:14px;margin:0;}
  .pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;}
  .pad button{width:72px;height:72px;border-radius:50%;background:var(--sunk);font:600 26px/1 var(--f-ui);}
  .pad button:active{background:var(--gold-soft);}
  .pad .blank{visibility:hidden;}
  .lock-forgot{font-size:14px;color:var(--ink-3);font-weight:600;padding:0 12px;min-height:44px;}

  /* ---------- тост ---------- */
  .toast{
    position:fixed;z-index:60;left:50%;transform:translateX(-50%);
    bottom:calc(16px + env(safe-area-inset-bottom,0px));
    width:max-content;max-width:calc(100% - 32px);
    background:var(--cash-bg);color:var(--cash-ink);border:1px solid var(--cash-line);
    border-radius:16px;box-shadow:var(--shadow);
    display:flex;align-items:center;gap:6px;padding:6px 6px 6px 16px;font-size:15px;font-weight:600;
  }
  .toast span{padding:8px 0;white-space:normal;}
  .toast button{color:var(--cash-gold);font-weight:800;padding:10px 12px;border-radius:12px;white-space:nowrap;}

  /* ===================== Темы. Белая — «как прайс» (бумага, золото, мрамор), Тёмная — «ночной мрамор»,
     Зелёная — «изумрудный бархат». Тема выбирается в настройках и хранится на устройстве: атрибут data-skin на <html>. ===================== */
  :root{
    --bg:#ECE2D4; --surface:rgba(251,247,240,.84); --surface-solid:#FAF5EE; --sunk:rgba(222,207,188,.55);
    --ink:#43362A; --ink-2:#6B5A47; --ink-3:#998670; --line:rgba(153,120,77,.22);
    --gold:#8A6838; --gold-btn:#B8925A; --gold-ink:#2C2116; --gold-soft:rgba(184,146,90,.15);
    --gold-grad:linear-gradient(110deg,#7A5A30 0%,#A9844F 22%,#E3C99C 46%,#F1DDB8 52%,#B8925A 74%,#7A5A30 100%);
    --cash-bg:#2B231B; --cash-ink:#F4EADB; --cash-dim:#BDA98D; --cash-gold:#E3C99C; --cash-line:rgba(227,201,156,.22);
    --scrim:rgba(43,35,27,.32);
    --shadow:0 24px 60px rgba(70,52,30,.22); --shadow-sm:0 1px 1px rgba(70,52,30,.05),0 8px 24px rgba(70,52,30,.07); --foot-shade:rgba(70,52,30,.12);
    --field:rgba(255,255,255,.6); --tabs-bg:rgba(222,207,188,.45); --pad-bg:rgba(255,255,255,.35); --chip-bg:var(--surface-solid);
    --top-bg:linear-gradient(var(--bg) 78%,transparent); --top-blur:none;
    --op-paper:.32; --op-dark:0; --op-green:0; --op-marble:.7; --op-mala:0; --op-arcs:.9; --arcs-filter:none;
    --photo-filter:none; --photo-glow:none;
    --f-display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
    --f-script:'Marck Script','Segoe Script',cursive;

  :root[data-skin="dark"]{
    --bg:#0D0A08; --surface:rgba(22,18,14,.72); --surface-solid:#16120E; --sunk:rgba(255,255,255,.05);
    --ink:#F2E8D8; --ink-2:#CDB99C; --ink-3:#8E7C66; --line:rgba(227,201,156,.2);
    --gold:#E3C99C; --gold-btn:#D2B07A; --gold-ink:#1C150D; --gold-soft:rgba(227,201,156,.12);
    --gold-grad:linear-gradient(110deg,#8E6B3A 0%,#C9A774 26%,#F3E0BC 47%,#FFF2D8 52%,#C9A774 76%,#8E6B3A 100%);
    --cash-bg:#080605;
    --ok:#85C99F; --ok-soft:rgba(133,201,159,.13); --warn:#EDA265; --warn-soft:rgba(237,162,101,.14); --bad:#F2887D; --bad-soft:rgba(242,136,125,.13);
    --scrim:rgba(0,0,0,.55); --shadow:0 24px 60px rgba(0,0,0,.6); --shadow-sm:inset 0 1px 0 rgba(255,255,255,.04),0 12px 30px rgba(0,0,0,.45); --foot-shade:rgba(0,0,0,.6);
    --field:rgba(255,255,255,.06); --tabs-bg:rgba(255,255,255,.05); --pad-bg:rgba(255,255,255,.05); --chip-bg:rgba(255,255,255,.04);
    --op-paper:0; --op-dark:.95; --op-marble:0; --op-arcs:.85; --arcs-filter:drop-shadow(0 0 6px rgba(227,201,156,.45));
    --photo-filter:brightness(.62) contrast(1.18) saturate(.9);
    --photo-glow:radial-gradient(circle at 78% 22%,rgba(255,196,120,.28),transparent 55%);
    color-scheme:dark;
  }
  :root[data-skin="green"]{
    --bg:#06130F; --surface:rgba(9,30,23,.74); --surface-solid:#0A1E18; --sunk:rgba(255,255,255,.05);
    --ink:#F1EBDC; --ink-2:#C9C6AE; --ink-3:#86978A; --line:rgba(232,211,168,.2);
    --gold:#E8D3A8; --gold-btn:#D9BF8C; --gold-ink:#1A1A10; --gold-soft:rgba(232,211,168,.12);
    --gold-grad:linear-gradient(110deg,#8F7A4E 0%,#D3BA88 28%,#F7EACB 50%,#D3BA88 72%,#8F7A4E 100%);
    --cash-bg:#030D0A;
    --ok:#8FD3AA; --ok-soft:rgba(143,211,170,.13); --warn:#EDA265; --warn-soft:rgba(237,162,101,.14); --bad:#F2887D; --bad-soft:rgba(242,136,125,.13);
    --scrim:rgba(0,0,0,.55); --shadow:0 24px 60px rgba(0,0,0,.6); --shadow-sm:inset 0 1px 0 rgba(255,255,255,.04),0 12px 30px rgba(0,0,0,.45); --foot-shade:rgba(0,0,0,.6);
    --field:rgba(255,255,255,.06); --tabs-bg:rgba(255,255,255,.05); --pad-bg:rgba(255,255,255,.05); --chip-bg:rgba(255,255,255,.04);
    --top-bg:linear-gradient(rgba(10,34,26,.62),rgba(10,34,26,.4) 72%,transparent); --top-blur:blur(14px);
    --op-paper:0; --op-green:1; --op-marble:0; --op-mala:.85; --op-arcs:.55; --arcs-filter:drop-shadow(0 0 6px rgba(232,211,168,.4));
    --photo-filter:brightness(.6) contrast(1.12) saturate(.75);
    --photo-glow:linear-gradient(to right,rgba(6,19,15,.9),transparent 45%);
    color-scheme:dark;
  }

  /* фон: слои всех тем лежат друг на друге, видимость — через прозрачность (плавная смена темы) */
  .decor{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;}
  .decor > *{position:absolute;transition:opacity .6s ease;}
  .decor .paper{inset:0;background-image:var(--tex-paper);opacity:var(--op-paper);}
  .decor .fx-dark{inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 30%,rgba(0,0,0,.65) 100%),var(--tex-nero) center/cover;opacity:var(--op-dark);}
  .decor .fx-green{inset:0;background:var(--tex-velvet),radial-gradient(ellipse at 18% 0%,rgba(32,110,82,.42),transparent 60%),radial-gradient(ellipse at 90% 100%,rgba(16,70,52,.5),transparent 55%),#06130F;opacity:var(--op-green);}
  .decor .glow{inset:0;background:radial-gradient(ellipse at 30% 25%,rgba(70,190,135,.32),transparent 55%),radial-gradient(ellipse at 80% 85%,rgba(40,150,105,.22),transparent 50%);opacity:0;}

  .decor .mala{left:0;bottom:0;width:460px;height:400px;background:var(--tex-mala) left bottom/cover no-repeat;opacity:var(--op-mala);
    -webkit-mask-image:radial-gradient(ellipse 100% 100% at 0% 100%,#000 35%,transparent 78%);mask-image:radial-gradient(ellipse 100% 100% at 0% 100%,#000 35%,transparent 78%);}
  .top{background:transparent;box-shadow:none;clip-path:none;}
  .top::before{content:'';position:absolute;inset:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0 calc(-1*max(16px,env(safe-area-inset-right,0px)));
    background:var(--top-bg);-webkit-backdrop-filter:var(--top-blur);backdrop-filter:var(--top-blur);z-index:-1;}

  /* шапка: логотип золотом с переливом */
  .brand h1{font:600 30px/1 var(--f-display);letter-spacing:.06em;display:flex;align-items:baseline;gap:10px;}
  .brand h1 .logo{font:inherit;letter-spacing:.06em;margin:0;top:0;color:transparent;background:var(--gold-grad);background-size:220% 100%;background-position:0 0;-webkit-background-clip:text;background-clip:text;}
  .brand h1 .tag{font:700 10px/1 var(--f-ui);letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);margin:0;top:-3px;}
  /* узкий телефон: логотип помещается рядом с кнопками, страница не уменьшается */
  .brand h1{min-width:0;}
  @media (max-width:420px){.brand h1{font-size:clamp(19px,6vw,26px);letter-spacing:.04em;}.brand h1 .tag{display:none;}}
  .ib{color:var(--gold);}
  .ib[aria-pressed="true"]{background:var(--gold-soft);}

  /* вкладки с перетекающей подложкой */
  .tabs{position:relative;background:var(--tabs-bg);border:1px solid var(--line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);}
  .tab{position:relative;z-index:1;transition:color .25s;}
  .tab[aria-selected="true"]{background:transparent;box-shadow:none;color:var(--ink);}
  .tab-ind{position:absolute;z-index:0;top:4px;bottom:4px;left:0;width:0;border-radius:10px;background:var(--surface-solid);box-shadow:var(--shadow-sm);
    transition:transform .38s cubic-bezier(.3,.9,.25,1),width .38s cubic-bezier(.3,.9,.25,1);}
  .badge.g{background:var(--gold-grad);background-size:200% 100%;color:var(--gold-ink);}

  /* карточки: матовое стекло, золотые волосяные линии */
  .group,.cal,.tile,.mat{background:var(--surface);border:1px solid var(--line);-webkit-backdrop-filter:blur(10px) saturate(1.1);backdrop-filter:blur(10px) saturate(1.1);box-shadow:var(--shadow-sm);}
  .group > * + *{border-top:1px solid var(--line);}
  h2.h{color:var(--gold);letter-spacing:.16em;}
  .day-h{font:600 28px/1.15 var(--f-display);letter-spacing:.01em;}
  .cal-head b{font:600 26px/1.1 var(--f-display);letter-spacing:.02em;}
  .cal-wd.we{color:var(--gold);}
  .cbtn,.ctoday{background:transparent;border:1px solid var(--line);color:var(--ink);}
  .cd .n{font-weight:600;}
  .cd.today{box-shadow:inset 0 0 0 1.5px var(--gold-btn);}
  .cd[aria-pressed="true"]{background:var(--gold-grad);background-size:220% 100%;background-position:30% 0;color:var(--gold-ink);box-shadow:0 6px 16px rgba(140,106,60,.28);}
  .cd[aria-pressed="true"] .n{color:var(--gold-ink);}
  .cd[aria-pressed="true"] .c{background:rgba(255,255,255,.55);color:var(--gold-ink);}
  .cd[aria-pressed="true"] .tt{color:var(--gold-ink);opacity:.85;}
  .cd .c{background:var(--gold-soft);color:var(--gold);}
  .bk-time{font:600 24px/1 var(--f-display);font-variant-numeric:lining-nums tabular-nums;letter-spacing:.01em;}
  .bk-time small{font:600 12px/1.4 var(--f-ui);}
  .gap{background:transparent;color:var(--ink-3);}
  .gap em{color:var(--gold);}
  .cash-sum{font-family:var(--f-display);}
  .sheet-head h3,.set-head b{font-family:var(--f-display);}

  /* кнопки: золото с бликом, мягкое «вдавливание» */
  .btn.primary{background:var(--gold-grad);background-size:220% 100%;background-position:60% 0;color:var(--gold-ink);border:0;
    box-shadow:0 10px 22px rgba(140,106,60,.26),inset 0 1px 0 rgba(255,255,255,.45);transition:background-position .6s ease,transform .12s ease,box-shadow .2s;}
  .btn.primary:active{background-position:20% 0;}
  .btn,.tile,.bk,.cd,.chip,.gap,.step-b,.need-chip,.entry,.row-main{transition:transform .12s ease,background-color .2s,box-shadow .2s;}
  .btn:active,.tile:active,.bk:active,.cd:active,.chip:active,.gap:active,.step-b:active,.need-chip:active{transform:scale(.97);}
  .chip{background:var(--chip-bg);}
  .chip[aria-checked="true"],.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface-solid);border-color:var(--ink);}
  .skin-sel{min-height:44px;min-width:150px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--ink);font:600 16px/1 var(--f-ui);padding:0 12px;}

  /* окна: пружинка и матовое стекло за ними */
  .scrim{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
  .sheet{background:var(--surface-solid);animation:up2 .42s cubic-bezier(.2,.9,.25,1.08);}
  .sheet-head,.sheet-foot{background:var(--surface-solid);}
  .foot-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:10px;}
  .foot-row .btn{padding:0 12px;}
  .sheet-head h3{font:600 28px/1.1 var(--f-display);}
  @keyframes up2{from{transform:translateY(46px);opacity:0}to{transform:none;opacity:1}}
  .fld input,.fld textarea,.fld select{background:var(--field);}

  /* ---------- экран входа (PIN) как обложка прайса ---------- */
  .lock{background:var(--bg);overflow:hidden;}
  .lock > .lock-paper,.lock > .lock-fx{position:absolute;inset:0;pointer-events:none;transition:opacity .6s;}
  .lock-paper{background-image:var(--tex-paper);opacity:var(--op-paper);}

  .lock-box{position:relative;z-index:1;gap:14px;max-width:360px;}
  @media (min-width:700px){ .lock-box{margin-right:30%;} }
  @media (max-width:699px){ .lock-photo{width:70%;opacity:.28;} .lock-arcs{width:100%;right:-20%;} }
  .lock-tag{font:700 10px/1 var(--f-ui);letter-spacing:.32em;color:var(--ink-3);animation:fadeUp .8s ease-out .1s both;}
  .lock-brand{font:500 clamp(46px,7vw,64px)/1 var(--f-display);letter-spacing:.06em;color:transparent;background:var(--gold-grad);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;
    animation:fadeUp .9s ease-out .2s both,shine 2.6s ease-out .6s both;}
  .lock-rule{display:flex;align-items:center;gap:12px;width:100%;max-width:300px;font:700 11px/1 var(--f-ui);letter-spacing:.3em;text-transform:uppercase;color:var(--ink-2);animation:fadeUp .8s ease-out .35s both;}
  .lock-rule i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-btn),transparent);}
  .lock-t{color:var(--ink-2);font-size:15px;margin-top:6px;animation:fadeUp .8s ease-out .45s both;}
  .dots{animation:fadeUp .8s ease-out .5s both;}
  .dots i{border:1.5px solid var(--gold-btn);width:13px;height:13px;transition:transform .2s;}
  .dots i.on{background:var(--gold-grad);background-size:200% 100%;border-color:transparent;animation:pop .22s ease-out;}
  .pad{grid-template-columns:repeat(3,74px);gap:16px;animation:fadeUp .8s ease-out .55s both;}
  .pad button{width:74px;height:74px;background:var(--pad-bg);border:1px solid var(--line);font:500 32px/1 var(--f-display);color:var(--ink);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:background .15s,transform .1s;}
  .pad button:active{background:var(--gold-soft);transform:scale(.95);}
  .lock-forgot{color:var(--ink-3);}
  .lock-script{font:400 30px/1.1 var(--f-script);color:var(--gold);margin-top:4px;animation:fadeUp 1s ease-out .9s both;}
  .lock.out{opacity:0;transform:scale(1.03);transition:opacity .45s ease,transform .45s ease;}

  /* ---------- общие анимации ---------- */
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes shine{from{background-position:100% 0}to{background-position:0 0}}
  @keyframes pop{50%{transform:scale(1.35)}}
  @keyframes rowIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes cellIn{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
  @keyframes viewR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
  @keyframes viewL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
  @keyframes viewUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes slideL{from{opacity:.15;transform:translateX(34px)}to{opacity:1;transform:none}}
  @keyframes slideR{from{opacity:.15;transform:translateX(-34px)}to{opacity:1;transform:none}}
  @keyframes flash{0%{box-shadow:0 0 0 0 rgba(212,170,100,0)}22%{box-shadow:0 0 0 3px var(--gold-btn),0 0 30px rgba(212,170,100,.55);background-color:var(--gold-soft)}100%{box-shadow:var(--shadow-sm)}}
  @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  @keyframes sheen{0%{opacity:0;transform:translateX(-45%)}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translateX(45%)}}
  @keyframes breathe{0%{opacity:0}30%{opacity:1}55%{opacity:.35}80%{opacity:.9}100%{opacity:0}}
  /* 4. смена вкладки: экран въезжает со стороны вкладки, блоки поднимаются по очереди, клетки календаря — волной */
  .view.vin-r{animation:viewR .44s cubic-bezier(.2,.8,.3,1) both;}
  .view.vin-l{animation:viewL .44s cubic-bezier(.2,.8,.3,1) both;}
  .view.vin-0{animation:viewUp .44s cubic-bezier(.2,.8,.3,1) both;}
  .cascade .ci{animation:rowIn .52s cubic-bezier(.2,.8,.3,1) var(--d,0ms) both;}
  .cascade .cc{animation:cellIn .42s cubic-bezier(.2,.8,.3,1) var(--d,0ms) both;}
  /* 5. полоски расходов наливаются */
  .bar .track i{transform-origin:left center;}
  .cascade .bar .track i{animation:grow .8s cubic-bezier(.2,.8,.3,1) .15s both;}
  /* 3. календарь сдвигается при смене месяца */
  .cal-grid.slide-l{animation:slideL .32s cubic-bezier(.2,.8,.3,1);}
  .cal-grid.slide-r{animation:slideR .32s cubic-bezier(.2,.8,.3,1);}
  /* 2. плитка вспыхивает после записи приёма, в уведомлении рисуется галочка */
  .tile.flash{animation:flash 1.1s ease-out both;}
  .tick{width:22px;height:22px;flex:none;color:var(--cash-gold);display:inline-flex;align-items:center;}
  .tick svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
  .tick path{stroke-dasharray:1;stroke-dashoffset:0;}
  .tick.go path{animation:draw .45s ease-out .1s both;}
  /* 6. плавная смена цветов при смене темы */
  html.skin-anim body,html.skin-anim body *{transition:background-color .5s ease,color .5s ease,border-color .5s ease,box-shadow .5s ease!important;}

  /* ---------- анимации тем: по разу сразу после ввода PIN (класс intro на <html>) ---------- */
  html.intro .brand h1 .logo,html.hello .brand h1 .logo{animation:shine 2.4s ease-out .2s both;}
  html.intro[data-skin="white"] .decor .arcs ellipse{stroke-dasharray:1;animation:draw 2.4s cubic-bezier(.3,.6,.3,1) .3s both;}
  html.intro[data-skin="white"] .decor .arcs ellipse + ellipse{animation-delay:.7s;}
  html.intro[data-skin="dark"] .decor .sheen{animation:sheen 3.2s ease-in-out .5s 1 both;}
  html.intro[data-skin="green"] .decor .glow{animation:breathe 6s ease-in-out .3s 1 both;}

  @media (prefers-reduced-motion:reduce){
    .lock-tag,.lock-brand,.lock-rule,.lock-t,.dots,.pad,.lock-script,.brand h1 .logo,.sheet,.view,.cascade *,.cal-grid,.tile.flash,.tick path,html.intro *,html.hello *{animation:none!important;}
    .tab-ind,.lock.out,.decor > *,html.skin-anim body *{transition:none!important;}
  }
</style>

  /* ---------- запись в базу ---------- */

    flushing = true; syncUi();

  function upsert(path, patch){

  }
  function addEntry(e){

  // меняет остаток и возвращает, на сколько он реально изменился (не посчитанный и нулевой не уходят в минус)
  function changeQty(id,delta){
    var it = S.items[id]; if (!it) return 0;
    var q = isNum(it.qty) ? it.qty : null;

  // чего не хватит на списание (только для посчитанных остатков)

  // после отмены закупки материал, который до неё не был посчитан, снова «не посчитан», а не 0

  // журнал месяца или, если есть поиск, совпадения за всё время
  function drawJournal(){
    var q = normName(S.jq), cur = today().slice(0,7), mi = +S.month.slice(5,7)-1, list;
    if (q){
      list = entries().filter(function(e){
        var cn = e.cl && S.clients[e.cl] ? S.clients[e.cl].name : '';
        var hay = normName([entryTitle(e), entrySub(e), e.n, e.c, cn, String(Math.abs(e.a)), qf(Math.abs(e.a))].join(' '));
        return hay.indexOf(q)>=0;
      });
    } else list = entries().filter(function(e){ return e.d.slice(0,7)===S.month; });
    list.sort(function(a,b){ return a.d<b.d ? 1 : a.d>b.d ? -1 : (b.ts||0)-(a.ts||0); });
    var more = list.length>150; if (more) list = list.slice(0,150);
    var j = '', lastDay = '';
    if (!list.length){
      j = '<div class="empty">'+(q ? 'Ничего не нашла.' : S.month===cur
        ? 'В этом месяце записей пока нет. Когда уйдёт клиентка, нажми на зону. Когда что-то оплатишь, нажми «Расход».'
        : 'В '+MON_P[mi]+' записей нет.')+'</div>';

    list.forEach(function(e){

      j += '<button class="entry" data-act="entry" data-m="'+e.m_+'" data-id="'+esc(e.id)+'"><span><span class="t">'+esc(entryTitle(e))+(needsCheck(e) ? '<span class="chkdot">'+(e.a<0 ? 'аннулировать чек' : 'нет чека')+'</span>' : '')+'</span>'+(sub?'<span class="s">'+esc(sub)+'</span>':'')+'</span>'+
        '<span class="a sum '+entryCls(e)+'">'+entryAmount(e)+'</span></button>';

  }

  /* ---------- касса: внесла, забрала, перевод, сверка ---------- */
  function cashNow(){
    var cash = isNum(S.settings.start) ? S.settings.start : 0, card = isNum(S.settings.startCard) ? S.settings.startCard : 0;
    entries().forEach(function(e){
      if (e.t==='mv'){
        if (e.k==='x'){ if (e.p==='нал'){ cash -= e.a; card += e.a; } else { card -= e.a; cash += e.a; } }
        else { var mv = e.k==='out' ? -e.a : e.a; if (e.p==='нал') cash += mv; else card += mv; }
        return;
      }
      var v = e.t==='in' ? e.a : -e.a; if (e.p==='нал') cash += v; else card += v;
    });
    return { cash:r2(cash), card:r2(card) };
  }
  function openCash(){
    var MODES = [['in','Внесла свои'],['out','Забрала себе'],['x','Нал → карта'],['xr','Карта → нал'],['adj','Сверка']];
    var now = cashNow();
    var body =
      '<div class="chips" role="radiogroup" aria-label="Что сделать">'+MODES.map(function(m,i){ return '<button class="chip sm" role="radio" data-md="'+m[0]+'" aria-checked="'+(i===0)+'">'+m[1]+'</button>'; }).join('')+'</div>'+
      '<p class="hint" id="k-hint"></p>'+
      '<div id="k-one"><label class="fld"><span>Сумма</span><div class="money-in"><input id="k-amt" inputmode="decimal" autocomplete="off" placeholder="0"><i>₽</i></div></label>'+
        '<div id="k-pay">'+payChips('нал')+'</div></div>'+
      '<div id="k-adj" hidden><p class="hint">По учёту сейчас: наличные <b class="sum">'+rub(now.cash)+'</b>, на карте <b class="sum">'+rub(now.card)+'</b>. Впиши, сколько есть на самом деле — разница запишется как сверка.</p>'+
        '<div class="fld-row even"><label class="fld"><span>Наличные по факту</span><div class="money-in"><input id="k-cash" inputmode="decimal" value="'+now.cash+'" autocomplete="off"><i>₽</i></div></label>'+
        '<label class="fld"><span>На карте по факту</span><div class="money-in"><input id="k-card" inputmode="decimal" value="'+now.card+'" autocomplete="off"><i>₽</i></div></label></div></div>'+
      '<div class="fld-row">'+dateField('k-date')+'<label class="fld"><span>Заметка</span><input id="k-note" placeholder="необязательно" autocomplete="off" maxlength="120"></label></div>';
    var foot = '<button class="btn primary block" id="k-save">Записать</button>';
    var HINT = { in:'Свои деньги в кассу кабинета. Это не доход: налог не считается, приход месяца не меняется.',
      out:'Взяла деньги кабинета себе. Это не расход кабинета: итог месяца не меняется, остаток денег уменьшается.',
      x:'Сдала наличные на карту. Всего денег не меняется.', xr:'Сняла с карты наличными. Всего денег не меняется.',
      adj:'' };
    openSheet('Касса', body, function(root){
      var md = 'in', pay = wirePay(root, 'нал');
      function upd(){
        $('k-hint').textContent = HINT[md];
        $('k-one').hidden = md==='adj'; $('k-adj').hidden = md!=='adj';
        $('k-pay').hidden = md==='x' || md==='xr';
      }
      wireRadio(root, 'data-md', function(v){ md = v; upd(); });
      $('k-save').addEventListener('click', function(){
        var d = readDate($('k-date')), note = $('k-note').value.trim().slice(0,120), made = [];
        if (md==='adj'){
          var fc = parseNum($('k-cash').value), fk = parseNum($('k-card').value);
          if (!isNum(fc)){ $('k-cash').focus(); return; } if (!isNum(fk)){ $('k-card').focus(); return; }
          [['нал', r2(fc-now.cash)], ['пер', r2(fk-now.card)]].forEach(function(x){
            if (x[1]) made.push({ id:uid(), t:'mv', k:'adj', a:x[1], p:x[0], d:d, ts:Date.now(), n:note || 'по факту '+(x[0]==='нал' ? 'наличных' : 'на карте')+' '+rub(x[0]==='нал' ? fc : fk) });
          });
          if (!made.length){ closeSheet(); toast('Всё сходится, сверка не нужна', null, null, 0, true); return; }
        } else {
          var a = parseNum($('k-amt').value); if (!(a>0)){ $('k-amt').focus(); return; }
          var e = { id:uid(), t:'mv', k:md==='xr' ? 'x' : md, a:r2(a), p:md==='x' ? 'нал' : md==='xr' ? 'пер' : pay.v, d:d, ts:Date.now() };
          if (note) e.n = note;
          made.push(e);
        }
        closeSheet();
        made.forEach(addEntry);
        toast(made.length>1 || md==='adj' ? 'Сверка записана' : mvTitle(made[0])+': '+rub(made[0].a), 'Отменить', function(){ made.forEach(function(e){ removeEntry(e.d.slice(0,7), e.id, true); }); }, 0, true);
      });
      upd(); roSheet();
    }, foot);
  }

  var sheetClose = null;
  function openSheet(title, body, mount, foot){
    $('sheet').classList.remove('wide');
    $('sheetTitle').textContent = title;
    $('sheetBody').innerHTML = body;
    $('sheetFoot').innerHTML = foot || '';
    $('sheetFoot').hidden = !foot;
    $('scrim').hidden = false;
    $('sheet').scrollTop = 0;
    fitScrim();
    sheetClose = mount ? mount($('sheetBody'), $('sheetFoot')) : null;
  }
  function fitScrim(){
    var vv = window.visualViewport, sc = $('scrim');
    if (!vv || sc.hidden) return;
    if (Math.abs(vv.height - window.innerHeight) < 2 && !vv.offsetTop){ sc.style.top = ''; sc.style.height = ''; sc.style.bottom = ''; return; }
    sc.style.top = vv.offsetTop+'px'; sc.style.height = vv.height+'px'; sc.style.bottom = 'auto';
  }
  function closeSheet(){
    $('scrim').hidden = true;
    $('sheetBody').innerHTML = ''; $('sheetFoot').innerHTML = '';
    if (typeof sheetClose==='function') sheetClose();
    sheetClose = null;
  }

    $('sheet').querySelectorAll('input,textarea,select,.step-b,.chip,.btn,.use-x').forEach(function(x){ if (!x.classList.contains('keep')) x.disabled = true; });

  function wirePay(root, init){
    var st = { v:init };
    root.querySelectorAll('[data-pay]').forEach(function(c){
      c.addEventListener('click', function(){
        st.v = c.getAttribute('data-pay');
        root.querySelectorAll('[data-pay]').forEach(function(o){ o.setAttribute('aria-checked', String(o===c)); });
      });
    });
    return st;
  }
  function wireRadio(root, attr, onPick){
    root.querySelectorAll('['+attr+']').forEach(function(c){
      c.addEventListener('click', function(){
        root.querySelectorAll('['+attr+']').forEach(function(o){ o.setAttribute('aria-checked', String(o===c)); });
        onPick(c.getAttribute(attr));
      });
    });

  // двойное нажатие для необратимых действий; sure — текст подтверждения

      if (btn.classList.contains('armed')){ clearTimeout(t); fn(); return; }
      btn.classList.add('armed'); btn.textContent = sure || 'Ещё раз — удалить';

  function usesEditor(box, uses, items, onChange){
    items = items || procItems();

      var rest = items.filter(function(p){ return !shown[p[0]]; });
      var groups = {}, order = [];
      rest.forEach(function(p){ var g = p[1].group || 'Другое'; if (!groups[g]){ groups[g] = []; order.push(g); } groups[g].push(p); });
      box.innerHTML =

  /* ---------- запись клиенток ---------- */
  function tmin(t){ var p = String(t||'0:0').split(':'); return (+p[0]||0)*60 + (+p[1]||0); }
  function tstr(m){ m = Math.max(0, Math.min(24*60, Math.round(m))); return pad(Math.floor(m/60))+':'+pad(m%60); }
  function durLabel(m){ var h = Math.floor(m/60), r = m%60; return (h ? h+' ч' : '')+(h && r ? ' ' : '')+(r ? r+' мин' : ''); }
  function nowMin(){ var d = new Date(); return d.getHours()*60 + d.getMinutes(); }
  function dateObj(ds){ var p = ds.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
  function dayName(ds){
    var d = dateObj(ds), t = today(), pre = ds===t ? 'Сегодня, ' : ds===shiftDay(t,1) ? 'Завтра, ' : ds===shiftDay(t,-1) ? 'Вчера, ' : '';
    return pre + d.getDate()+' '+MON_G[d.getMonth()]+', '+WD_FULL[d.getDay()];
  }
  function bookingList(){ return Object.keys(S.bookings).map(function(id){ return [id,S.bookings[id]]; }).filter(function(p){ return p[1] && p[1].d && p[1].t; }); }
  function active(b){ return b.st!=='cancel' && b.st!=='noshow'; }
  function bDur(b){ return +b.dur>0 ? +b.dur : 60; }
  function dayList(ds){ return bookingList().filter(function(p){ return p[1].d===ds; }).sort(function(a,b){ return tmin(a[1].t)-tmin(b[1].t); }); }
  function work(){ var s = S.settings; return { from:tmin(s.workFrom||'10:00'), to:tmin(s.workTo||'20:00'), step:+s.slot>0 ? +s.slot : 30 }; }
  function svcNames(ids){ return (ids||[]).map(function(id){ return S.services[id] && S.services[id].name; }).filter(Boolean).join(', '); }
  function todayLeft(){ var t = today(), n = nowMin(); return dayList(t).filter(function(p){ return active(p[1]) && p[1].st!=='done' && tmin(p[1].t)+bDur(p[1]) > n; }).length; }
  // свободные окна дня в рабочее время (для сегодня — начиная с текущего времени)
  function gaps(ds, exceptId){
    var w = work(), cur = w.from, out = [];
    if (ds===today()) cur = Math.max(cur, Math.ceil(nowMin()/w.step)*w.step);
    if (ds<today()) return [];
    dayList(ds).filter(function(p){ return p[0]!==exceptId && active(p[1]); }).forEach(function(p){
      var st = tmin(p[1].t), en = st + bDur(p[1]);
      if (st > cur) out.push([cur, Math.min(st, w.to)]);
      cur = Math.max(cur, en);
    });
    if (cur < w.to) out.push([cur, w.to]);
    return out.filter(function(g){ return g[1]-g[0] >= w.step; });
  }
  // время для новой записи: сразу после последней клиентки дня, если она есть и до конца дня хватает места; иначе первое свободное окно
  function firstFree(ds, dur, exceptId){
    var w = work(), g = gaps(ds, exceptId);
    var act = dayList(ds).filter(function(p){ return p[0]!==exceptId && active(p[1]); });
    if (act.length){
      var lastEnd = Math.max.apply(null, act.map(function(p){ return tmin(p[1].t)+bDur(p[1]); }));
      if (ds===today()) lastEnd = Math.max(lastEnd, Math.ceil(nowMin()/w.step)*w.step);
      if (lastEnd + dur <= w.to) return lastEnd;
    }
    for (var i=0;i<g.length;i++) if (g[i][1]-g[i][0] >= dur) return g[i][0];
    return g.length ? g[0][0] : null;
  }
  function overlapsWith(ds, t, dur, exceptId){
    var s0 = tmin(t), e0 = s0 + dur;
    return dayList(ds).filter(function(p){ return p[0]!==exceptId && active(p[1]) && tmin(p[1].t) < e0 && tmin(p[1].t)+bDur(p[1]) > s0; });
  }
  // запись прошла (время окончания позади), а отметки «пришла / не пришла» ещё нет
  function needsConfirm(b){
    if (b.st && b.st!=='plan') return false;
    var t = today();
    if (b.d < t) return true;
    if (b.d > t) return false;
    return tmin(b.t)+bDur(b) <= nowMin();
  }
  function toConfirm(){
    return bookingList().filter(function(p){ return needsConfirm(p[1]); })
      .sort(function(a,b){ return a[1].d<b[1].d ? -1 : a[1].d>b[1].d ? 1 : tmin(a[1].t)-tmin(b[1].t); });
  }
  // клиентка пришла: открыть приём с её зонами, ценой из прайса и раскрытыми расходниками
  function bookingCame(id){

    openVisit((b.svc||[]).filter(function(x){ return S.services[x]; }), 'visit', {

  /* ---------- клиентки ---------- */
  function normName(x){ return String(x||'').trim().toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' '); }
  function clientList(){
    return Object.keys(S.clients).map(function(id){ return [id,S.clients[id]]; })
      .filter(function(p){ return p[1] && p[1].name; })
      .sort(function(a,b){ return String(a[1].name).localeCompare(b[1].name,'ru'); });
  }
  function findClient(name){
    var k = normName(name); if (!k) return null;
    for (var id in S.clients){ var c = S.clients[id]; if (c && normName(c.name)===k) return id; }
    return null;
  }
  function setClient(id, ch){

    write(p, {k:'up', d:ch});
  }
  // id клиентки по имени; новую создаёт сама
  function ensureClient(name, phone){
    name = String(name||'').trim(); if (!name) return null;
    var id = findClient(name);
    if (id){ if (phone && !S.clients[id].phone) setClient(id, {phone:phone}); return id; }
    id = uid();
    var doc = { name:name.slice(0,80), phone:phone||'', ts:Date.now() };
    local('clients/'+id, doc); write('clients/'+id, {k:'set', d:doc});
    return id;
  }
  function clientNamesDatalist(listId){
    var seen = {}, names = [];
    clientList().forEach(function(p){ seen[normName(p[1].name)] = 1; names.push(p[1].name); });
    bookingList().forEach(function(x){ var n = (x[1].name||'').trim(); if (n && !seen[normName(n)]){ seen[normName(n)] = 1; names.push(n); } });
    names.sort(function(a,b){ return a.localeCompare(b,'ru'); });
    return '<datalist id="'+listId+'">'+names.map(function(n){ return '<option value="'+esc(n)+'"></option>'; }).join('')+'</datalist>';
  }
  // приёмы клиентки (процедуры, без возвратов), по дате
  function clientVisits(id){
    return entries().filter(function(e){ return e.cl===id && e.t==='in' && e.a>=0 && e.s && e.s.length; })
      .sort(function(a,b){ return a.d<b.d ? -1 : a.d>b.d ? 1 : (a.ts||0)-(b.ts||0); });
  }
  function clientPaid(id){ var t = 0; entries().forEach(function(e){ if (e.cl===id && e.t==='in') t += e.a; }); return t; }
  function nextBooking(id){
    var td = today(), n = nowMin();
    var list = bookingList().filter(function(x){ var b = x[1]; return b.cl===id && active(b) && b.st!=='done' && (b.d>td || (b.d===td && tmin(b.t)+bDur(b)>n)); })
      .sort(function(a,b){ return a[1].d<b[1].d ? -1 : a[1].d>b[1].d ? 1 : tmin(a[1].t)-tmin(b[1].t); });

  function courseText(id){

  }
  function recallWeeks(){ var w = S.settings.recall; return isNum(w) && w>0 ? w : 4; }
  function daysBetween(a, b){ return Math.round((dateObj(b)-dateObj(a))/864e5); }
  // пора позвать: последний визит давно, курс не закончен, следующей записи нет, «позже» не отложено
  function recallList(){
    var td = today(), wk = recallWeeks();
    return clientList().filter(function(p){
      var id = p[0], c = p[1], v = clientVisits(id);
      if (!v.length || c.done) return false;
      if (isNum(c.course) && c.course>0 && v.length>=c.course) return false;
      if (c.snz && c.snz>td) return false;
      if (nextBooking(id)) return false;
      return daysBetween(v[v.length-1].d, td) >= wk*7;

  // кнопки «написать»: WhatsApp и СМС по номеру, Telegram — выбрать чат с готовым текстом
