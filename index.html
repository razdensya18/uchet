      roSheet();
    }, foot);
  }

  /* ---------- приём и продажа ---------- */
  function openVisit(pre, mode, opts){
    opts = opts || {};
    var isSale = mode==='sale';
    var pres = Array.isArray(pre) ? pre : (pre ? [pre] : []);
    var svcs = serviceList(), goods = goodsList(), pay0 = opts.pay || lastPay(), prepaid = +opts.prepaid || 0;
    var body =
      (svcs.length ? (isSale ? '<div class="sec-l">Процедуры</div>' : '')+'<div class="tiles">'+svcs.map(function(p){
        var s = p[1];
        return '<button class="tile" data-id="'+p[0]+'" aria-pressed="false"><span>'+esc(s.name)+'</span>'+
          (isNum(s.price) ? '<b>'+priceLabel(s)+'</b>' : '<b class="nop">цена не указана</b>')+'</button>';
      }).join('')+'</div>' : '')+
      (goods.length ? '<div class="sec-l">Товары</div><div class="mat" style="padding:4px 14px">'+goods.map(function(p){
        var it = p[1];
        return '<div class="good" data-good="'+p[0]+'"><span class="nm">'+esc(it.name)+'<small>'+rub(it.sale)+(isNum(it.qty)?' · осталось '+qf(it.qty)+' '+esc(unitOf(it)):'')+'</small></span>'+
          '<div class="step"><button class="step-b" data-g="'+p[0]+'" data-d="-1" aria-label="Меньше: '+esc(it.name)+'">−</button>'+
          '<span class="step-q" id="gq-'+p[0]+'">0</span>'+
          '<button class="step-b plus" data-g="'+p[0]+'" data-d="1" aria-label="Больше: '+esc(it.name)+'">+</button></div></div>';
      }).join('')+'</div>' : '')+
      '<label class="fld"><span>Сумма</span><div class="money-in"><input id="v-amt" inputmode="decimal" autocomplete="off" placeholder="0"><i>₽</i></div></label>'+
      '<p class="hint" id="v-hint"></p>'+
      '<div class="mat" id="v-mat" hidden><button class="mat-sum" id="v-mat-t" aria-expanded="false"></button><div class="mat-ed" id="v-mat-ed" hidden></div></div>'+
      payChips(pay0)+
      '<div class="chips"><button class="chip sm" id="v-chk" aria-pressed="'+(!!opts.chk)+'">Чек в «Мой налог» выбит</button></div>'+
      '<label class="fld"><span>Клиентка</span><input id="v-cl" list="v-cls" value="'+esc(opts.clientName||'')+'" placeholder="имя — для истории и курса" autocomplete="off" maxlength="80"></label>'+clientNamesDatalist('v-cls')+
      '<div class="fld-row">'+dateField('v-date', opts.date)+'<label class="fld"><span>Заметка</span><input id="v-note" value="'+esc(opts.note||'')+'" placeholder="необязательно" autocomplete="off"></label></div>';
    var foot = '<button class="btn primary block" id="v-save" disabled>Записать</button>';
    openSheet(opts.replace ? 'Исправить запись' : isSale ? 'Продажа / приход' : 'Приём', body, function(root){
      var sel = [], gq = {}, manual = false, mat = {}, matOpen = !!opts.matOpen, chk = !!opts.chk;
      var amt = $('v-amt'), hint = $('v-hint'), save = $('v-save');
      var pay = wirePay(root, pay0);
      function matSummary(){
        var n = usesCount(mat);
        $('v-mat-t').innerHTML = n ? '<span>Спишется: <b>'+esc(usesText(mat, 3))+'</b></span><em>'+(matOpen?'свернуть':'изменить')+'</em>'
          : '<span>Материалы не спишутся</span><em>'+(matOpen?'свернуть':'добавить')+'</em>';
      }
      function drawMat(){
        $('v-mat').hidden = !sel.length;
        if (!sel.length) return;
        $('v-mat-ed').hidden = !matOpen;
        $('v-mat-t').setAttribute('aria-expanded', String(matOpen));
        if (matOpen) usesEditor($('v-mat-ed'), mat, procItems(), matSummary);
        matSummary();
      }
      $('v-mat-t').addEventListener('click', function(){ matOpen = !matOpen; drawMat(); });
      function upd(){
        var auto = 0, noPrice = [], fromP = [];
        sel.forEach(function(id){
          var s = S.services[id]; if (!s) return;
          if (isNum(s.price)) auto += s.price; else noPrice.push(s.name);
          if (s.from) fromP.push(s.name);
        });
        var over = [];
        for (var g in gq){ var it = S.items[g]; if (!it || !gq[g]) continue; auto += gq[g]*(+it.sale||0); if (isNum(it.qty) && gq[g]>it.qty) over.push(it.name); }
        var any = sel.length || Object.keys(gq).some(function(k){ return gq[k]>0; });
        if (prepaid && sel.length) auto = Math.max(0, auto - prepaid);
        if (!manual) amt.value = any && (auto || prepaid) ? String(r2(auto)) : '';
        var parts = [];
        if (prepaid && sel.length) parts.push('Предоплата <b>'+rub(prepaid)+'</b> уже в кассе — к оплате остаток.');
        if (noPrice.length) parts.push('У «'+esc(noPrice.join('», «'))+'» нет цены в прайсе, впиши сумму.');
        if (fromP.length) parts.push('У «'+esc(fromP.join('», «'))+'» цена «от», проверь сумму.');
        if (over.length) parts.push('Товара «'+esc(over.join('», «'))+'» в остатке меньше.');
        if (!any) parts.push(isSale ? 'Отметь товар или процедуру, или впиши сумму (например, предоплату).' : 'Выбери зону или впиши сумму.');
        hint.innerHTML = parts.join(' ');
        hint.hidden = !parts.length;
        var a = parseNum(amt.value), zeroOk = prepaid>0 && sel.length && a===0;
        save.disabled = !(a>0) && !zeroOk;
        save.textContent = a>0 ? 'Записать +'+rub(a) : zeroOk ? 'Записать (оплачено предоплатой)' : 'Записать';
      }
      root.querySelectorAll('.tile').forEach(function(t){
        t.addEventListener('click', function(){
          var id = t.getAttribute('data-id'), i = sel.indexOf(id), before = visitMaterials(sel);
          if (i<0) sel.push(id); else sel.splice(i,1);
          t.setAttribute('aria-pressed', String(i<0));
          var after = visitMaterials(sel), keys = {};
          Object.keys(before).concat(Object.keys(after), Object.keys(mat)).forEach(function(k){ keys[k] = 1; });
          for (var k in keys) mat[k] = Math.max(0, r2((+mat[k]||0) + (after[k]||0) - (before[k]||0)));
          if (opts.replace) manual = false;
          drawMat(); upd();
        });
      });
      root.querySelectorAll('[data-g]').forEach(function(b){
        b.addEventListener('click', function(){
          var id = b.getAttribute('data-g'), v = Math.max(0, (gq[id]||0) + (+b.getAttribute('data-d')));
          gq[id] = v; $('gq-'+id).textContent = v;
          root.querySelector('[data-good="'+id+'"]').classList.toggle('on', v>0);
          upd();
        });
      });
      $('v-chk').addEventListener('click', function(){ chk = !chk; $('v-chk').setAttribute('aria-pressed', String(chk)); });
      amt.addEventListener('input', function(){ manual = amt.value.trim()!==''; upd(); });
      save.addEventListener('click', function(){
        var a = parseNum(amt.value); if (!(a>0) && !(prepaid>0 && sel.length && a===0)) return;
        var e = { id:uid(), t:'in', a:r2(a), d:readDate($('v-date')), ts:Date.now(), p:pay.v };
        var names = [], gl = [], need = {};
        sel.forEach(function(id){ var s = S.services[id]; if (s) names.push({n:String(s.name), p:isNum(s.price)?s.price:null}); });
        for (var k in mat) if (mat[k]>0 && S.items[k]) need[k] = -mat[k];
        for (var g in gq){
          var it = S.items[g]; if (!it || !(gq[g]>0)) continue;
          gl.push({id:g, n:String(it.name), q:gq[g], p:+it.sale||0});
          need[g] = r2((need[g]||0) - gq[g]);
        }
        if (names.length) e.s = names;
        if (gl.length) e.g = gl;
        if (prepaid && names.length) e.pre = prepaid;
        if (chk) e.chk = true;
        var uu = {}; for (var kk in mat) if (mat[kk]>0 && S.items[kk]) uu[kk] = r2(mat[kk]); if (Object.keys(uu).length) e.u = uu;
        var note = $('v-note').value.trim(); if (note) e.n = note.slice(0,120);
        var clName = $('v-cl').value.trim();
        lsSet('uchet_pay', pay.v);
        closeSheet();
        // исправление: старая запись снимается (материалы возвращаются), новая встаёт на её место
        var old = null, oldBk = null;
        if (opts.replace){
          old = S.ops[opts.replace.m] && S.ops[opts.replace.m].e && S.ops[opts.replace.m].e[opts.replace.id];
          if (old && !old.del){
            oldBk = visitBooking(old, opts.replace.id);
            patchEntry(opts.replace.m, opts.replace.id, {del:true});
            if (old.m) applyStock(old.m, -1);
            if (old.nq) resetUncounted(old.nq);
            e.ts = old.ts || e.ts;
            if (old.k) e.k = old.k;
          } else old = null;
        }
        var cl = (opts.cl && S.clients[opts.cl] && clName===opts.clientName) ? opts.cl : ensureClient(clName, '');
        if (cl) e.cl = cl;
        var bk = opts.bk || oldBk; if (bk) e.bk = bk;
        var short = shortfalls(need);
        var applied = applyStock(need,1);
        if (Object.keys(applied).length) e.m = applied;
        addEntry(e);
        if (oldBk) setBooking(oldBk, {eid:e.id});
        if (opts.onSaved) opts.onSaved(e);
        S.flash = { ids:sel.slice(), t0:Date.now() };
        var ct = cl && names.length ? courseText(cl) : '';
        var kind = old ? 'Запись исправлена' : names.length ? 'Приём записан' : gl.length ? 'Продажа записана' : 'Приход записан';
        toast(kind+': +'+rub(e.a)+(ct ? ' · '+firstName(S.clients[cl] && S.clients[cl].name)+': '+ct : '')+(short.length ? '. Не хватило: '+short.join(', ') : '')+(!chk && e.a>0 ? '. Чек — в «Мой налог»' : ''), 'Отменить', function(){
          removeEntry(e.d.slice(0,7), e.id, true);
          if (old){
            patchEntry(opts.replace.m, opts.replace.id, {del:false});
            if (old.m) applyStock(old.m, 1);
            if (oldBk) setBooking(oldBk, {st:'done', eid:opts.replace.id});
          }
          if (opts.onUndo) opts.onUndo();
        }, short.length ? 10000 : 7000, true);
      });
      pres.forEach(function(pid){
        var t = root.querySelector('.tile[data-id="'+pid+'"]'); if (t) t.click();
      });
      // исправление записи: товары, списанные материалы и сумма как были
      if (opts.goods) for (var g0 in opts.goods){ if (!$('gq-'+g0)) continue; gq[g0] = opts.goods[g0]; $('gq-'+g0).textContent = gq[g0]; root.querySelector('[data-good="'+g0+'"]').classList.add('on'); }
      if (opts.mat){ mat = Object.assign({}, opts.mat); drawMat(); }
      if (isNum(opts.amount)){ amt.value = String(opts.amount); manual = true; }
      upd();
      roSheet();
    }, foot);
  }

  function openExpense(pre){
    pre = pre || {};
    var cl = cats().slice(), last = pre.cat || lsGet('uchet_cat');
    if (pre.cat && cl.indexOf(pre.cat)<0) cl.push(pre.cat);
    if (cl.indexOf(last)<0 || last==='Материалы') last = cl.filter(function(c){ return c!=='Материалы'; })[0] || cl[0];
    var pay0 = pre.pay || lastPay();
    var body =
      '<label class="fld"><span>Сумма</span><div class="money-in"><input id="x-amt" inputmode="decimal" autocomplete="off" placeholder="0" value="'+(pre.amount>0 ? pre.amount : '')+'"><i>₽</i></div></label>'+
      '<div class="fld"><span>Категория</span><div class="chips" role="radiogroup" aria-label="Категория">'+
        cl.map(function(c){ return '<button class="chip" role="radio" data-c="'+esc(c)+'" aria-checked="'+(c===last)+'">'+esc(c)+'</button>'; }).join('')+
      '</div></div>'+
      '<p class="hint">«Материалы» откроет закупку: там же пополнятся остатки.</p>'+
      payChips(pay0)+
      '<div class="fld-row">'+dateField('x-date')+'<label class="fld"><span>На что</span><input id="x-note" placeholder="необязательно" autocomplete="off" value="'+esc(pre.note||'')+'"></label></div>';
    var foot = '<button class="btn primary block" id="x-save" disabled>Записать расход</button>';
    openSheet('Расход', body, function(root){
      var cat = last, amt = $('x-amt'), save = $('x-save');
      var pay = wirePay(root, pay0);
      function toPurchase(){
        var a = parseNum(amt.value), d = readDate($('x-date')), pv = pay.v;
        closeSheet(); openPurchase(null, { amount:a>0 ? r2(a) : 0, date:d, pay:pv });
      }
      function upd(){ var a = parseNum(amt.value); save.disabled = !(a>0); save.textContent = a>0 ? 'Записать −'+rub(a) : 'Записать расход'; }
      wireRadio(root, 'data-c', function(c){ if (c==='Материалы'){ toPurchase(); return; } cat = c; });
      amt.addEventListener('input', upd);
      save.addEventListener('click', function(){
        var a = parseNum(amt.value); if (!(a>0)) return;
        var e = { id:uid(), t:'out', a:r2(a), d:readDate($('x-date')), ts:Date.now(), c:cat, p:pay.v };
        var note = $('x-note').value.trim();
        if (note) e.n = note.slice(0,160);
        if (pre.rid) e.rid = pre.rid;
        if (!pre.cat) lsSet('uchet_cat', cat);
        lsSet('uchet_pay', pay.v);
        closeSheet();
        if (cats().indexOf(cat)<0) saveSettings({ cats:cats().concat([cat]) });
        addEntry(e);
        if (pre.onSaved) pre.onSaved(e);
        toast('Расход записан: −'+rub(e.a), 'Отменить', function(){ removeEntry(e.d.slice(0,7), e.id, true); if (pre.onUndo) pre.onUndo(); }, 0, true);
      });
      upd();
      if (!(pre.amount>0)) try{ amt.focus(); }catch(e){}
      roSheet();
    }, foot);
  }

  // закупка «от суммы»: сверху сумма чека, ниже все материалы с «+» (одно нажатие = упаковка) → остатки пополняются, деньги уходят в расход «Материалы»
  function openPurchase(prefill, pre){
    pre = pre || {};
    var buy = {}, pay0 = pre.pay || lastPay();
    for (var k in (prefill||{})) if (S.items[k]) buy[k] = prefill[k];
    var body =
      '<label class="fld"><span>Сумма чека</span><div class="money-in"><input id="p-amt" inputmode="decimal" autocomplete="off" placeholder="0" value="'+(pre.amount>0 ? pre.amount : '')+'"><i>₽</i></div></label>'+
      '<div class="fld"><span>Что купила — «+» добавляет упаковку</span><div id="p-list" class="uses buy"></div></div>'+
      payChips(pay0)+
      '<div class="fld-row">'+dateField('p-date', pre.date)+'<label class="fld"><span>Где купила</span><input id="p-note" placeholder="например, Wildberries" autocomplete="off" maxlength="80"></label></div>';
    var foot = '<p class="hint foot-hint" id="p-hint"></p><button class="btn primary block" id="p-save">Записать</button>';
    function packOf(it){ return isNum(it.pack) && it.pack>1 ? it.pack : 1; }
    // подпись: не выбран — что даёт «+» и сколько есть; выбран — было → станет
    function info(k){
      var it = S.items[k], v = +buy[k] || 0, u = esc(unitOf(it)), pk = packOf(it), has = isNum(it.qty);
      if (v>0) return (has ? 'было '+qf(it.qty)+' → ' : '')+'<em>станет '+qf(r2((has ? it.qty : 0)+v))+' '+u+'</em>';
      return (pk>1 ? 'уп. '+qf(pk)+' '+u : u)+' · '+(has ? 'есть '+qf(it.qty) : 'не посчитан');
    }
    function rowHtml(k){
      var it = S.items[k], v = +buy[k] || 0, nm = esc(it.name), st = itemState(it);
      var name = '<b>'+nm+'</b><small'+(st==='out'||st==='low' ? ' class="low"' : '')+'>'+info(k)+'</small>';
      return '<div class="use'+(v>0?' on':'')+'" data-row="'+k+'">'+
        (v>0 ? '<span class="buy-nm">'+name+'</span><div class="step">'+
            '<button class="step-b" data-k="'+k+'" data-d="-1" aria-label="Меньше на упаковку: '+nm+'">−</button>'+
            '<input class="use-in" data-k="'+k+'" inputmode="decimal" value="'+v+'" autocomplete="off" aria-label="Сколько купила: '+nm+'">'+
            '<button class="step-b plus" data-k="'+k+'" data-d="1" aria-label="Ещё упаковку: '+nm+'">+</button></div>'
          : '<button class="buy-nm" data-add="'+k+'">'+name+'</button><div class="step">'+
            '<button class="step-b solo" data-add="'+k+'" aria-label="Добавить упаковку: '+nm+'">+</button></div>')+
        '</div>';
    }
    openSheet('Закупка материалов', body, function(root){
      $('sheet').classList.add('wide');
      var amt = $('p-amt'), save = $('p-save'), hint = $('p-hint'), list = $('p-list');
      var pay = wirePay(root, pay0);
      // сначала то, что заканчивается, дальше по группам
      var need = {}, items = itemList(), html = '';
      needList().forEach(function(p){ need[p[0]] = 1; });
      var needRows = items.filter(function(p){ return need[p[0]]; });
      if (needRows.length) html += '<div class="buy-g warn">Заканчивается</div>'+needRows.map(function(p){ return rowHtml(p[0]); }).join('');
      var lastG = null;
      items.forEach(function(p){
        if (need[p[0]]) return;
        var g = p[1].group || 'Другое';
        if (g!==lastG){ html += '<div class="buy-g">'+esc(g)+'</div>'; lastG = g; }
        html += rowHtml(p[0]);
      });
      list.innerHTML = items.length ? html : '<p class="hint">Материалов пока нет. Добавь их в настройках → «Материалы и товары».</p>';
      function redraw(k){ var rw = list.querySelector('[data-row="'+k+'"]'); if (rw) rw.outerHTML = rowHtml(k); }
      function put(k, v){ buy[k] = Math.max(0, r2(v||0)); redraw(k); upd(); }
      list.addEventListener('click', function(ev){
        var b = ev.target.closest('button'); if (!b || b.disabled) return;
        var k = b.getAttribute('data-add') || b.getAttribute('data-k'), it = S.items[k]; if (!it) return;
        if (b.hasAttribute('data-add')) put(k, packOf(it));
        else put(k, (+buy[k]||0) + (+b.getAttribute('data-d'))*packOf(it));
      });
      // ввод числа вручную: без перерисовки строки, чтобы не терять фокус
      list.addEventListener('input', function(ev){
        var i = ev.target; if (!i.classList.contains('use-in')) return;
        var k = i.getAttribute('data-k'), n = parseNum(i.value);
        buy[k] = isNum(n) && n>0 ? r2(n) : 0;
        var sm = i.closest('.use').querySelector('.buy-nm small');
        if (sm) sm.innerHTML = info(k);
        upd();
      });
      list.addEventListener('focusout', function(ev){
        var i = ev.target; if (!i.classList || !i.classList.contains('use-in')) return;
        var k = i.getAttribute('data-k'); if (!(buy[k]>0)) setTimeout(function(){ redraw(k); }, 0);
      });
      function upd(){
        var n = usesCount(buy), a = parseNum(amt.value), ok = a>0;
        save.disabled = !n && !ok;
        save.textContent = ok ? (n ? 'Записать закупку −'+rub(a) : 'Записать −'+rub(a)+' в расходы') : n ? 'Пополнить остатки' : 'Впиши сумму или нажми «+»';
        hint.innerHTML = ok && n ? 'В остатки: <b>'+esc(usesText(buy, 2))+'</b>. В расходы «Материалы»: <b>−'+rub(a)+'</b>.'
          : ok ? 'Нажми «+» у купленного — остатки пополнятся. Без этого запишется только расход.'
          : n ? 'В остатки: <b>'+esc(usesText(buy, 2))+'</b>. Без суммы в расходы ничего не запишется.'
          : 'Впиши сумму чека, потом «+» у купленного: одно нажатие — одна упаковка.';
      }
      amt.addEventListener('input', upd);
      save.addEventListener('click', function(){
        var add = {}; for (var k in buy) if (buy[k]>0 && S.items[k]) add[k] = r2(buy[k]);
        var n = Object.keys(add).length, a = parseNum(amt.value);
        if (!n && !(a>0)) return;
        var d = readDate($('p-date')), place = $('p-note').value.trim().slice(0,80);
        lsSet('uchet_pay', pay.v);
        closeSheet();
        var nq = Object.keys(add).filter(function(k){ return !isNum(S.items[k].qty); });
        var applied = n ? applyStock(add, 1) : {}, costNote = '';
        if (n===1 && a>0){
          // купила один материал — запомнить цену упаковки для себестоимости
          var ck = Object.keys(add)[0], cit = S.items[ck], cpk = isNum(cit.pack) && cit.pack>1 ? cit.pack : 1, cc = r2(a/add[ck]*cpk);
          if (cc>0 && cc!==cit.cost){ var cp = 'items/'+ck; local(cp, Object.assign({}, S.items[ck], {cost:cc})); write(cp, {k:'up', d:{cost:cc}}); costNote = ', цена упаковки '+rub(cc); }
        }
        if (a>0){
          var what = n ? usesText(add) : '';
          var e = { id:uid(), t:'out', a:r2(a), d:d, ts:Date.now(), c:'Материалы', p:pay.v,
            n:(place && what ? place+': '+what : place || what || 'Закупка материалов') };
          if (Object.keys(applied).length) e.m = applied;
          if (nq.length) e.nq = nq;
          addEntry(e);
          toast(n ? 'Закупка записана: −'+rub(e.a)+', остатки пополнены'+costNote : 'Расход записан: −'+rub(e.a), 'Отменить', function(){ removeEntry(e.d.slice(0,7), e.id, true); }, 0, true);
        } else {
          toast('Остатки пополнены', 'Отменить', function(){ applyStock(applied, -1); resetUncounted(nq); }, 0, true);
        }
      });
      upd();
      roSheet();
      // сразу к сумме: клавиатура открывается, если суммы ещё нет
      if (!(pre.amount>0) && writable()) try { amt.focus({preventScroll:true}); } catch(_){ amt.focus(); }

  /* ---------- PIN ---------- */
  function hex(buf){ return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ('0'+b.toString(16)).slice(-2); }).join(''); }
  function fnv(str){ var h = 0x811c9dc5; for (var i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193)>>>0; } return ('0000000'+h.toString(16)).slice(-8); }
  function hashPin(pin, salt, algo){
    var str = salt+':'+pin;
    var canSha = window.crypto && crypto.subtle && window.TextEncoder;
    if (algo!=='fnv' && canSha){
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)).then(function(b){ return { h:hex(b), a:'sha256' }; });
    }
    if (algo==='sha256') return Promise.reject(new Error('no-sha'));
    var h = str; for (var i=0;i<2000;i++) h = fnv(h+str);
    return Promise.resolve({ h:h, a:'fnv' });
  }
  function pinOn(){ var p = S.settings.pin; return !!(p && p.h); }
  function lockMinutes(){ var v = S.settings.lockMin; return isNum(v) ? v : 30; }
  var LK = { on:false, code:'', fails:0, wait:0, lastTouch:0 };
  function keepUnlocked(force){
    if (!pinOn() || LK.on) return;
    var now = Date.now();
    if (!force && now - LK.lastTouch < 15000) return;
    LK.lastTouch = now;
    var m = lockMinutes();
    lsSet('uchet_unl', String(now + (m>0 ? m*60000 : 3650*864e5)));
  }
  function checkLock(){
    if (!S.got.settings) return;
    if (!pinOn()){ if (LK.on) hideLock(); if (!LK.hello){ LK.hello = true; htmlClass('hello', 3000); } return; }
    if (!LK.on && Date.now() > (+lsGet('uchet_unl')||0)) showLock();
  }
  function lockDots(){ $('lockDots').querySelectorAll('i').forEach(function(d,i){ d.classList.toggle('on', i<LK.code.length); }); }
  function showLock(){ LK.on = true; LK.code = ''; lockDots(); $('lockErr').textContent = ''; $('lock').hidden = false; }
  function hideLock(anim){
    LK.on = false;
    var l = $('lock');
    if (anim && !reducedMotion() && !l.hidden){ l.classList.add('out'); setTimeout(function(){ l.hidden = true; l.classList.remove('out'); }, 450); }
    else l.hidden = true;
  }
  function lockKey(k){
    if (!LK.on) return;
    if (Date.now() < LK.wait){ $('lockErr').textContent = 'Подожди '+Math.ceil((LK.wait-Date.now())/1000)+' с'; return; }
    if (k==='del'){ LK.code = LK.code.slice(0,-1); lockDots(); return; }
    if (LK.code.length>=4) return;
    LK.code += k; lockDots();
    if (LK.code.length<4) return;
    var p = S.settings.pin, code = LK.code;
    hashPin(code, p.s, p.a).then(function(r){
      if (r.h===p.h){ LK.fails = 0; hideLock(true); keepUnlocked(true); S.cascade = true; render(); htmlClass('intro', 7000); return; }
      LK.fails++; LK.code = ''; lockDots();
      $('lockDots').classList.remove('shake'); void $('lockDots').offsetWidth; $('lockDots').classList.add('shake');
      if (LK.fails>=5){ LK.wait = Date.now()+30000; LK.fails = 0; $('lockErr').textContent = 'Пять ошибок подряд. Подожди 30 секунд.'; }
      else $('lockErr').textContent = 'Неверный PIN';
    }, function(){ $('lockErr').textContent = 'Этот браузер не может проверить PIN. Открой учёт в Safari или Chrome.'; LK.code=''; lockDots(); });
  }

  /* ---------- выгрузка ---------- */
  // на iPad открывается «Поделиться»: «Сохранить в Файлы», Telegram, AirDrop; на компьютере — скачивание
  function saveFile(name, text, mime){
    var blob = new Blob([text], { type:mime });
    try {
      var file = new File([blob], name, { type:mime });
      if (navigator.canShare && navigator.canShare({ files:[file] })){
        return navigator.share({ files:[file], title:name }).then(function(){ return true; }, function(e){
          if (e && e.name==='AbortError') return false;
          throw e;
        });
      }
    } catch(e){}
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    return Promise.resolve(true);
  }

        render(); return;
      }
      if (act==='cal-today'){ S.calDay = today(); S.calMonth = S.calDay.slice(0,7); render(); return; }
      if (act==='bk-open'){ openBooking(id); return; }
      if (act==='cl-open'){ openClient(id); return; }
      if (act==='rem'){ if (writable() && S.bookings[id]) setBooking(id, {rem:Date.now()}); return; }
      if (act==='work'){ openWork(); return; }
      if (act==='recall'){ openRecall(); return; }
      if (act==='mprev'){ S.month = shiftMonth(S.month,-1); render(); return; }
      if (act==='mnext'){ var nm = shiftMonth(S.month,1); if (nm<=today().slice(0,7)){ S.month = nm; render(); } return; }
      if (act==='entry'){ openEntry(b.getAttribute('data-m'), id); return; }
      if (act==='itemq'){ openItemQuick(id); return; }
      if (act==='item'){ openItem(id); return; }
      if (act==='svc'){ openService(id); return; }
      if (act==='visituses'){ openVisitUses(); return; }
      if (act==='cats'){ openCats(); return; }
      if (act==='start'){ openStart(); return; }
      if (act==='tax'){ openTax(); return; }
      if (act==='export-month'){ exportCsv(false); return; }
      if (act==='checks'){ openChecks(); return; }
      if (act==='backup'){ exportBackup(); return; }
      if (act==='restore'){ restoreBackup(); return; }
      if (act==='recs'){ openRecs(); return; }
      if (act==='export-all'){ exportCsv(true); return; }
      if (act==='lock-now'){ lsSet('uchet_unl','0'); showLock(); return; }
      if (!writable()) return;
      if (act==='bk-new') openBooking(null, { d:b.getAttribute('data-d') || S.calDay, t:b.getAttribute('data-t') || null });
      else if (act==='cl-new') openClient(null);
      else if (act==='cl-book'){ var cc = S.clients[id]; if (cc) openBooking(null, { name:cc.name, cl:id }); }
      else if (act==='cl-snooze'){ setClient(id, {snz:shiftDay(today(), 14)}); toast('Напомню через 2 недели', 'Вернуть', function(){ setClient(id, {snz:null}); }); }
      else if (act==='bk-came') bookingCame(id);
      else if (act==='bk-noshow') bookingNoShow(id);
      else if (act==='visit') openVisit(id, 'visit');
      else if (act==='sale') openVisit(null, 'sale');
      else if (act==='expense') openExpense();
      else if (act==='cash') openCash();
      else if (act==='tax-pay'){
        var tm = id, tmi = +tm.slice(5,7)-1;
        openExpense({ amount:Math.round(Math.max(0, monthIncome(tm))*taxRate()/100), cat:'Налоги', note:'Налог самозанятой за '+MON[tmi].toLowerCase(),
          onSaved:function(){ var tp = Object.assign({}, S.settings.taxPaid||{}); tp[tm] = true; saveSettings({ taxPaid:tp }); },
          onUndo:function(){ var tp = Object.assign({}, S.settings.taxPaid||{}); delete tp[tm]; saveSettings({ taxPaid:tp }); } });
      }
      else if (act==='rec-pay'){ var rr = recList().filter(function(x){ return x.id===id; })[0]; if (rr) openExpense({ amount:rr.a, cat:rr.c, note:rr.n, rid:rr.id }); }
      else if (act==='rec-skip'){ var cm = today().slice(0,7), nl = recList().map(function(x){ return x.id===id ? Object.assign({}, x, {skip:cm}) : x; }); saveRec(nl); toast('Скрыто до следующего месяца'); }
      else if (act==='minus'){ var dd = changeQty(id,-1); if (dd) toast(S.items[id].name+': −1', 'Отменить', function(){ changeQty(id, -dd); }); }
      else if (act==='buy'){ var bp = {}, bi = S.items[id]; if (bi) bp[id] = isNum(bi.pack) && bi.pack>1 ? bi.pack : 1; openPurchase(bp); }
      else if (act==='purchase') openPurchase();
      else if (act==='recount') openRecount();
      else if (act==='buy-need') openPurchase(needPrefill());
      else if (act==='item-new') openItem(null);
      else if (act==='svc-new') openService(null);
      else if (act==='pin') openPin();
      else if (act==='fb-done'){ var f = S.feedback[id]; if (f){ var p = 'feedback/'+id, v = !f.done; local(p, Object.assign({}, f, {done:v})); write(p, {k:'up', d:{done:v}}); } }
    });
    $('sync').addEventListener('click', function(){
      if (!OUT.length){ toast('Всё сохранено в базе'); return; }
      toast('Ждут отправки: '+OUT.length+'. Они сохранены на этом устройстве и уйдут сами, когда появится интернет.', null, null, 6000);
      clearTimeout(retryT); flush();
    });
    window.addEventListener('online', function(){ clearTimeout(retryT); flush(); });
    $('sheetClose').addEventListener('click', closeSheet);
    $('scrim').addEventListener('click', function(ev){ if (ev.target===$('scrim')) closeSheet(); });
    $('lockPad').addEventListener('click', function(ev){ var b = ev.target.closest('[data-k]'); if (b) lockKey(b.getAttribute('data-k')); });
    $('lockForgot').addEventListener('click', function(){ $('lockErr').textContent = 'PIN знает Саша — спроси у него.'; });
    document.addEventListener('keydown', function(ev){
      if (LK.on){ if (/^\d$/.test(ev.key)) lockKey(ev.key); else if (ev.key==='Backspace') lockKey('del'); return; }
      if (ev.key==='Escape' && !$('scrim').hidden) closeSheet();
    });
    ['pointerdown','keydown'].forEach(function(t){ document.addEventListener(t, function(){ keepUnlocked(false); }, true); });
    document.addEventListener('visibilitychange', function(){ if (!document.hidden){ checkLock(); tick(); flush(); } });
    setInterval(checkLock, 20000);
    setInterval(tick, 60000);
    if (window.visualViewport){
      visualViewport.addEventListener('resize', fitScrim);
      visualViewport.addEventListener('scroll', fitScrim);
    }
  }

  // раз в минуту: наступил новый день — экраны переходят на него; закончилась запись — появляется «Подтверди визиты»
  var DAY = '';
  function tick(){
    if (document.hidden || S.dbState!=='on' || !ready()) return;
    var t = today();
    if (DAY && t!==DAY){
      if (S.month===DAY.slice(0,7)) S.month = t.slice(0,7);
      if (S.calDay===DAY){ S.calDay = t; S.calMonth = t.slice(0,7); }
      DAY = t; render(); return;
    }
    DAY = t;
    if (timeSig()!==S.sig) render();
  }
  function timeSig(){ return today()+'|'+toConfirm().length+'|'+todayLeft(); }

  /* ---------- база ---------- */
  function listen(){
    var db = S.db;
    function onErr(e){ if (e && (e.code==='revoked' || e.code==='not_granted' || e.code==='capability_disabled')){ S.dbState='off'; render(); } }
    COLS.forEach(function(col){
      db.collection(col).onSnapshot(function(snap){
        var o = {};
        snap.docs.forEach(function(d){ o[d.id] = d.data(); });
        R[col] = o; S.got[col] = true; compose(); render();
      }, onErr);
    });
    db.doc('settings/main').onSnapshot(function(s){
      R.settings = s.exists ? (s.data()||{}) : {}; S.got.settings = true; compose(); render();
    }, onErr);
  }
  /* База живёт внутри iPad: IndexedDB браузера, у этого адреса. Не стирается при закрытии и перезагрузке.
     Пропадёт, только если удалить иконку учёта с экрана «Домой» или стереть данные сайтов в Safari — для этого есть копии. */
  var IDB_NAME = 'uchet-razdensya';
  function openIdb(){
    return new Promise(function(res, rej){
      if (!window.indexedDB) return rej(new Error('no-idb'));
      var rq = indexedDB.open(IDB_NAME, 1);
      rq.onupgradeneeded = function(){ rq.result.createObjectStore('docs'); };
      rq.onsuccess = function(){ res(rq.result); };
      rq.onerror = function(){ rej(rq.error); };
    });
  }
  function idbLoadAll(idb){
    return new Promise(function(res, rej){
      var out = {}, tx = idb.transaction('docs','readonly'), cur = tx.objectStore('docs').openCursor();
      cur.onsuccess = function(){ var c = cur.result; if (c){ out[c.key] = c.value; c.continue(); } };
      tx.oncomplete = function(){ res(out); };
      tx.onerror = function(){ rej(tx.error); };
    });
  }
  function clone(x){ return x==null ? x : JSON.parse(JSON.stringify(x)); }
  function deepMerge(a, b){
    for (var k in b){
      var v = b[k];
      if (v && typeof v==='object' && v.__delete__===true){ delete a[k]; continue; }
      if (v && typeof v==='object' && !Array.isArray(v) && a[k] && typeof a[k]==='object' && !Array.isArray(a[k])) deepMerge(a[k], v);
      else a[k] = clone(v);
    }
    return a;
  }
  function LocalDB(idb, data){
    var subsCol = {}, subsDoc = {};
    function put(path, val){
      return new Promise(function(res, rej){
        var tx = idb.transaction('docs','readwrite'), st = tx.objectStore('docs');
        if (val===undefined) st.delete(path); else st.put(val, path);
        tx.oncomplete = function(){ res(); };
        tx.onerror = tx.onabort = function(){ var e = tx.error; rej({ code: e && e.name==='QuotaExceededError' ? 'quota_exceeded' : 'unavailable' }); };
      });
    }
    function docSnap(path){ var d = data[path]; return { id:path.split('/').pop(), exists:d!==undefined, data:function(){ return clone(d); } }; }
    function colSnap(col){ var docs = []; for (var p in data){ var q = p.split('/'); if (q.length===2 && q[0]===col) docs.push(docSnap(p)); } return { docs:docs }; }
    function notify(path){
      var col = path.split('/')[0];
      (subsCol[col]||[]).forEach(function(fn){ fn(colSnap(col)); });
      (subsDoc[path]||[]).forEach(function(fn){ fn(docSnap(path)); });
    }
    function ref(path){
      return {
        get: function(){ return Promise.resolve(docSnap(path)); },
        set: function(d){ var nd = clone(d); return put(path, nd).then(function(){ data[path] = nd; notify(path); }); },
        update: function(d){
          if (data[path]===undefined) return Promise.reject({ code:'invalid_argument' });
          var nd = deepMerge(clone(data[path]), d);
          return put(path, nd).then(function(){ data[path] = nd; notify(path); });
        },
        delete: function(){ return put(path, undefined).then(function(){ delete data[path]; notify(path); }); },
        onSnapshot: function(fn){ (subsDoc[path] = subsDoc[path]||[]).push(fn); setTimeout(function(){ fn(docSnap(path)); }, 0); }
      };
    }
    return {
      doc: ref,
      collection: function(col){ return { onSnapshot: function(fn){ (subsCol[col] = subsCol[col]||[]).push(fn); setTimeout(function(){ fn(colSnap(col)); }, 0); } }; },
      raw: data,
      // восстановление из копии: заменить всё целиком
      replaceAll: function(next){
        return new Promise(function(res, rej){
          var tx = idb.transaction('docs','readwrite'), st = tx.objectStore('docs');
          st.clear(); for (var p in next) st.put(next[p], p);
          tx.oncomplete = function(){ res(); };
          tx.onerror = tx.onabort = function(){ rej(tx.error); };
        });
      }
    };
  }
  // первый запуск: материалы, прайс с нормами и настройки, перенесённые из учёта на claude.ai
  function seedIfEmpty(db){
    if (Object.keys(db.raw).length) return Promise.resolve();
    var jobs = [];
    ['items','services'].forEach(function(col){ for (var id in (SEED[col]||{})) jobs.push(db.doc(col+'/'+id).set(SEED[col][id])); });
    jobs.push(db.doc('settings/main').set(SEED.settings || {}));
    return Promise.all(jobs);
  }
  // PIN по умолчанию (23.10.2026, решение Александра): ставится один раз на устройстве, где PIN ещё не задан.
  // Если потом сменить или выключить PIN в настройках — повторно не ставится (метка pinPreset).
  var PIN_PRESET = { h:'ddf693dc2fed268c919c4eff04acf8c732d164077b14b52108d239b059f10603', s:'rk1023', a:'sha256' };
  function presetPin(db){
    var st = db.raw['settings/main'] || {};
    if (st.pinPreset || (st.pin && st.pin.h)) return Promise.resolve();
    return db.doc('settings/main').set(Object.assign({}, st, { pin:PIN_PRESET, lockMin:isNum(st.lockMin) ? st.lockMin : 120, pinPreset:1 }));
  }
  function connect(){
    openIdb().then(function(idb){
      return idbLoadAll(idb).then(function(data){ return LocalDB(idb, data); });
    }).then(function(db){
      S.db = db; S.dbState = 'on'; S.canWrite = true; S.isOwner = false;
      window.__store = db.raw;
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});
      return seedIfEmpty(db).then(function(){ return presetPin(db); }).then(function(){ listen(); render(); flush(); });
    }).catch(function(){ S.dbState = 'off'; render(); });
  }
  // приложение для экрана «Домой»: работает без интернета, новая версия подхватывается сама
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(function(){});
  // на iPad и iPhone в обычном Safari: данные у иконки и у вкладки Safari разные — работать только с иконки
  function inSafariTab(){
    var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
    var standalone = window.navigator.standalone===true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
    return ios && !standalone;
  }

  S.month = today().slice(0,7); S.calDay = today(); S.calMonth = S.month;
  var t0 = lsGet('uchet_tab'); if (MAIN_TABS.indexOf(t0)>=0){ S.tab = t0; S.lastMain = t0; }
  // суммы скрыты при каждом открытии; глаз показывает их до следующего открытия
  setHide(true);
  loadOut(); bind(); render(); connect();
})();
</script>
